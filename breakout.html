<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Breakout — ArcadeHub</title>
<link rel="stylesheet" href="style.css">
<style>
  #breakout-canvas {
    background: #fffbeb;
    display: block;
    margin: 0 auto;
    cursor: none;
  }
</style>
</head>
<body>

<nav class="site-nav">
  <a class="nav-logo" href="index.html">Arcade<span>Hub</span></a>
  <ul class="nav-links">
    <li><a href="index.html">Home</a></li>
    <li><a href="snake.html">Snake</a></li>
    <li><a href="tetris.html">Tetris</a></li>
    <li><a href="breakout.html" class="active">Breakout</a></li>
  </ul>
</nav>

<main>
  <div class="game-page">
    <div class="game-page-header">
      <h1>🏓 Breakout</h1>
      <p>Move your paddle to keep the ball alive and smash every brick.</p>
    </div>

    <div class="game-container">
      <div class="game-hud">
        <div class="hud-stat">
          <span class="label">Score</span>
          <span class="value" id="bo-score">0</span>
        </div>
        <div class="hud-stat">
          <span class="label">Lives</span>
          <span class="value" id="bo-lives">3</span>
        </div>
        <div class="hud-stat">
          <span class="label">Level</span>
          <span class="value" id="bo-level">1</span>
        </div>
        <div class="hud-stat">
          <span class="label">Best</span>
          <span class="value" id="bo-best">0</span>
        </div>
        <div class="hud-spacer"></div>
        <button class="btn btn-primary" onclick="startGame()">New Game</button>
      </div>

      <canvas id="breakout-canvas" width="480" height="400"></canvas>

      <div class="game-status" id="bo-status"></div>

      <div class="controls-hint">
        <span class="key-hint">Mouse / Touch — Move paddle</span>
        <span class="key-hint">Click / Tap — Launch ball</span>
      </div>
    </div>
  </div>
</main>

<footer class="site-footer">
  <a href="index.html" style="color:inherit;text-decoration:none">← Back to all games</a>
  <span>ArcadeHub</span>
</footer>

<script>
const canvas = document.getElementById('breakout-canvas');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

const BRICK_ROWS = 6, BRICK_COLS = 10;
const BRICK_W = 42, BRICK_H = 16, BRICK_PAD = 4;
const BRICK_OFF_X = 9, BRICK_OFF_Y = 40;

const ROW_COLORS = ['#dc2626','#ea580c','#d97706','#16a34a','#2563eb','#7c3aed'];

let paddle, ball, bricks, score, lives, level, best = 0, af, running, launched;

function makeBricks(lv) {
  const b = [];
  for (let r = 0; r < BRICK_ROWS; r++) {
    for (let c = 0; c < BRICK_COLS; c++) {
      const hp = lv >= 3 && r < 2 ? 2 : 1;
      b.push({ x: BRICK_OFF_X + c*(BRICK_W+BRICK_PAD), y: BRICK_OFF_Y + r*(BRICK_H+BRICK_PAD), hp, maxHp: hp, color: ROW_COLORS[r] });
    }
  }
  return b;
}

function startGame() {
  cancelAnimationFrame(af);
  score = 0; lives = 3; level = 1; running = true; launched = false;
  paddle = { x: W/2 - 45, y: H - 30, w: 90, h: 12 };
  resetBall();
  bricks = makeBricks(level);
  updateHUD(); setStatus('');
  canvas.onclick = launchBall;
  canvas.ontouchstart = launchBall;
  loop();
}

function resetBall() {
  launched = false;
  ball = { x: W/2, y: H - 55, r: 7, vx: 0, vy: 0 };
}

function launchBall() {
  if (launched) return;
  launched = true;
  const angle = -Math.PI/2 + (Math.random()-0.5)*0.8;
  const spd = 4.5 + (level-1)*0.4;
  ball.vx = Math.cos(angle)*spd;
  ball.vy = Math.sin(angle)*spd;
}

function updateHUD() {
  document.getElementById('bo-score').textContent = score;
  document.getElementById('bo-lives').textContent = lives;
  document.getElementById('bo-level').textContent = level;
  document.getElementById('bo-best').textContent = best;
}

function setStatus(type, msg) {
  const el = document.getElementById('bo-status');
  el.className = 'game-status' + (type ? ' ' + type : '');
  el.textContent = msg || '';
}

function loop() {
  if (!running) return;
  update();
  draw();
  af = requestAnimationFrame(loop);
}

function update() {
  if (!launched) { ball.x = paddle.x + paddle.w/2; return; }

  ball.x += ball.vx;
  ball.y += ball.vy;

  // Walls
  if (ball.x - ball.r <= 0) { ball.vx = Math.abs(ball.vx); }
  if (ball.x + ball.r >= W) { ball.vx = -Math.abs(ball.vx); }
  if (ball.y - ball.r <= 0) { ball.vy = Math.abs(ball.vy); }

  // Paddle
  if (ball.vy > 0 && ball.y + ball.r >= paddle.y && ball.y - ball.r <= paddle.y + paddle.h &&
      ball.x >= paddle.x && ball.x <= paddle.x + paddle.w) {
    ball.vy = -Math.abs(ball.vy);
    const hit = (ball.x - (paddle.x + paddle.w/2)) / (paddle.w/2);
    ball.vx = hit * 6;
    const spd = Math.hypot(ball.vx, ball.vy);
    const maxSpd = 8 + (level-1)*0.5;
    if (spd > maxSpd) { ball.vx = ball.vx/spd*maxSpd; ball.vy = ball.vy/spd*maxSpd; }
  }

  // Fell
  if (ball.y - ball.r > H) {
    lives--;
    updateHUD();
    if (lives <= 0) {
      running = false;
      if (score > best) { best = score; }
      updateHUD();
      setStatus('lose', '💀 Game over! Score: ' + score);
      draw();
      return;
    }
    resetBall();
  }

  // Bricks
  bricks.forEach(b => {
    if (!b.hp) return;
    if (ball.x + ball.r > b.x && ball.x - ball.r < b.x + BRICK_W &&
        ball.y + ball.r > b.y && ball.y - ball.r < b.y + BRICK_H) {
      b.hp--;
      const pts = b.maxHp > 1 ? 15 : 10;
      score += pts * level;
      updateHUD();
      // Which side
      const overlapLeft = (ball.x + ball.r) - b.x;
      const overlapRight = (b.x + BRICK_W) - (ball.x - ball.r);
      const overlapTop = (ball.y + ball.r) - b.y;
      const overlapBot = (b.y + BRICK_H) - (ball.y - ball.r);
      const minH = Math.min(overlapLeft, overlapRight);
      const minV = Math.min(overlapTop, overlapBot);
      if (minH < minV) ball.vx *= -1; else ball.vy *= -1;
    }
  });

  // Level clear
  if (bricks.every(b => !b.hp)) {
    level++;
    setStatus('win', '🎉 Level ' + (level-1) + ' clear! Starting level ' + level + '…');
    setTimeout(() => {
      setStatus('');
      bricks = makeBricks(level);
      resetBall();
    }, 1800);
  }
}

function draw() {
  ctx.fillStyle = '#fffbeb';
  ctx.fillRect(0, 0, W, H);

  // Bricks
  bricks.forEach(b => {
    if (!b.hp) return;
    const alpha = b.maxHp > 1 && b.hp < b.maxHp ? 0.55 : 1;
    ctx.globalAlpha = alpha;
    ctx.fillStyle = b.color;
    ctx.beginPath();
    ctx.roundRect(b.x, b.y, BRICK_W, BRICK_H, 4);
    ctx.fill();
    // shine
    ctx.fillStyle = 'rgba(255,255,255,0.25)';
    ctx.beginPath();
    ctx.roundRect(b.x+2, b.y+2, BRICK_W-4, BRICK_H/3, 2);
    ctx.fill();
    ctx.globalAlpha = 1;
  });

  // Paddle
  const grad = ctx.createLinearGradient(paddle.x, paddle.y, paddle.x, paddle.y+paddle.h);
  grad.addColorStop(0, '#fbbf24');
  grad.addColorStop(1, '#d97706');
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.roundRect(paddle.x, paddle.y, paddle.w, paddle.h, 6);
  ctx.fill();

  // Ball
  ctx.beginPath();
  ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI*2);
  ctx.fillStyle = '#1a1a18';
  ctx.fill();
  ctx.beginPath();
  ctx.arc(ball.x - ball.r*0.3, ball.y - ball.r*0.3, ball.r*0.35, 0, Math.PI*2);
  ctx.fillStyle = 'rgba(255,255,255,0.5)';
  ctx.fill();

  // Launch prompt
  if (!launched && running) {
    ctx.fillStyle = 'rgba(0,0,0,0.45)';
    ctx.font = '500 0.85rem Outfit, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('Click or tap to launch', W/2, H/2);
    ctx.textAlign = 'left';
  }

  // Idle
  if (!running && score === 0 && !lives) {
    ctx.fillStyle = 'rgba(255,251,235,0.92)';
    ctx.fillRect(0,0,W,H);
    ctx.fillStyle = '#92400e';
    ctx.font = '500 0.9rem Outfit, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('Press New Game to start', W/2, H/2);
    ctx.textAlign = 'left';
  }
}

// Mouse
canvas.addEventListener('mousemove', e => {
  if (!running) return;
  const rect = canvas.getBoundingClientRect();
  paddle.x = e.clientX - rect.left - paddle.w/2;
  paddle.x = Math.max(0, Math.min(W - paddle.w, paddle.x));
});

// Touch
canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  const rect = canvas.getBoundingClientRect();
  paddle.x = e.touches[0].clientX - rect.left - paddle.w/2;
  paddle.x = Math.max(0, Math.min(W - paddle.w, paddle.x));
}, {passive:false});

// Draw idle screen
ctx.fillStyle = '#fffbeb';
ctx.fillRect(0,0,W,H);
ctx.fillStyle = '#92400e';
ctx.font = '500 0.9rem Outfit, sans-serif';
ctx.textAlign = 'center';
ctx.fillText('Press New Game to start', W/2, H/2);
ctx.textAlign = 'left';
</script>
</body>
</html>
