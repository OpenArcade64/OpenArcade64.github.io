<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Breakout — OpenArcade64</title>
<link rel="stylesheet" href="style.css">
<style>
  #breakout-canvas { background:#0d1117; display:block; margin:0 auto; cursor:none; }
</style>
</head>
<body>

<nav class="site-nav">
  <a class="nav-logo" href="index.html">OpenArcade<span class="logo-64">64</span></a>
  <ul class="nav-links">
    <li><a href="index.html">Home</a></li>
    <li><a href="snake.html">Snake</a></li>
    <li><a href="tetris.html">Tetris</a></li>
    <li><a href="breakout.html" class="active">Breakout</a></li>
  </ul>
</nav>

<main>
  <div class="game-page">
    <div class="game-page-header">
      <h1>🏓 Breakout</h1>
      <p>Move your paddle to keep the ball alive. Smash every brick to advance.</p>
    </div>
    <div class="game-container">
      <div class="game-hud">
        <div class="hud-stat"><span class="label">Score</span><span class="value" id="bo-score">0</span></div>
        <div class="hud-stat"><span class="label">Lives</span><span class="value" id="bo-lives">3</span></div>
        <div class="hud-stat"><span class="label">Level</span><span class="value" id="bo-level">1</span></div>
        <div class="hud-stat"><span class="label">Best</span><span class="value" id="bo-best">0</span></div>
        <div class="hud-spacer"></div>
        <button class="btn btn-primary" onclick="startGame()">New Game</button>
      </div>
      <canvas id="breakout-canvas" width="480" height="400"></canvas>
      <div class="game-status" id="bo-status"></div>
      <div class="controls-hint">
        <span class="key-hint">Mouse / Touch — Move paddle</span>
        <span class="key-hint">Click / Tap — Launch ball</span>
      </div>
    </div>
  </div>
</main>

<footer class="site-footer">
  <a href="index.html" style="color:inherit;text-decoration:none">← All games</a>
  <span>OpenArcade64</span>
</footer>

<script>
const canvas=document.getElementById('breakout-canvas');
const ctx=canvas.getContext('2d');
const W=canvas.width, H=canvas.height;
const BR=6, BC=10, BW=42, BH=16, BP=4, BOX=9, BOY=38;

// Blue-tinted row colors on dark canvas
const RCOLORS=['#ef4444','#f97316','#f59e0b','#22c55e','#3b82f6','#a78bfa'];

let paddle, ball, bricks, score, lives, level, best=0, af, running, launched;

function makeBricks(lv) {
  const b=[];
  for(let r=0;r<BR;r++) for(let c=0;c<BC;c++) {
    const hp=lv>=3&&r<2?2:1;
    b.push({x:BOX+c*(BW+BP),y:BOY+r*(BH+BP),hp,maxHp:hp,color:RCOLORS[r]});
  }
  return b;
}

function startGame() {
  cancelAnimationFrame(af);
  score=0; lives=3; level=1; running=true; launched=false;
  paddle={x:W/2-45,y:H-30,w:90,h:11};
  resetBall(); bricks=makeBricks(level);
  updateHUD(); setStatus('');
  canvas.onclick=launchBall; canvas.ontouchstart=launchBall;
  loop();
}

function resetBall() { launched=false; ball={x:W/2,y:H-55,r:7,vx:0,vy:0}; }

function launchBall() {
  if(launched) return; launched=true;
  const angle=-Math.PI/2+(Math.random()-0.5)*0.8;
  const spd=4.5+(level-1)*0.35;
  ball.vx=Math.cos(angle)*spd; ball.vy=Math.sin(angle)*spd;
}

function updateHUD() {
  document.getElementById('bo-score').textContent=score;
  document.getElementById('bo-lives').textContent=lives;
  document.getElementById('bo-level').textContent=level;
  document.getElementById('bo-best').textContent=best;
}

function setStatus(type,msg) {
  const el=document.getElementById('bo-status');
  el.className='game-status'+(type?' '+type:''); el.textContent=msg||'';
}

function loop() { if(!running) return; update(); draw(); af=requestAnimationFrame(loop); }

function update() {
  if(!launched){ball.x=paddle.x+paddle.w/2; return;}
  ball.x+=ball.vx; ball.y+=ball.vy;
  if(ball.x-ball.r<=0){ball.vx=Math.abs(ball.vx);}
  if(ball.x+ball.r>=W){ball.vx=-Math.abs(ball.vx);}
  if(ball.y-ball.r<=0){ball.vy=Math.abs(ball.vy);}

  // Paddle
  if(ball.vy>0&&ball.y+ball.r>=paddle.y&&ball.y-ball.r<=paddle.y+paddle.h&&ball.x>=paddle.x&&ball.x<=paddle.x+paddle.w){
    ball.vy=-Math.abs(ball.vy);
    const hit=(ball.x-(paddle.x+paddle.w/2))/(paddle.w/2);
    ball.vx=hit*6;
    const sp=Math.hypot(ball.vx,ball.vy),mx=8+(level-1)*0.4;
    if(sp>mx){ball.vx=ball.vx/sp*mx;ball.vy=ball.vy/sp*mx;}
  }

  // Bottom
  if(ball.y-ball.r>H){
    lives--; updateHUD();
    if(lives<=0){running=false;if(score>best){best=score;}updateHUD();setStatus('lose','💀 Game over — Score: '+score);draw();return;}
    resetBall();
  }

  // Bricks
  bricks.forEach(b=>{
    if(!b.hp) return;
    if(ball.x+ball.r>b.x&&ball.x-ball.r<b.x+BW&&ball.y+ball.r>b.y&&ball.y-ball.r<b.y+BH){
      b.hp--;
      score+=(b.maxHp>1?15:10)*level; updateHUD();
      const ol=ball.x+ball.r-b.x, or2=b.x+BW-(ball.x-ball.r), ot=ball.y+ball.r-b.y, ob=b.y+BH-(ball.y-ball.r);
      Math.min(ol,or2)<Math.min(ot,ob)?ball.vx*=-1:ball.vy*=-1;
    }
  });

  if(bricks.every(b=>!b.hp)){
    level++; setStatus('info','✓ Level '+(level-1)+' clear — starting level '+level+'…');
    setTimeout(()=>{setStatus('');bricks=makeBricks(level);resetBall();},1800);
  }
}

function draw() {
  ctx.fillStyle='#0d1117'; ctx.fillRect(0,0,W,H);

  // Subtle grid
  ctx.strokeStyle='#161b22'; ctx.lineWidth=0.5;
  for(let x=0;x<W;x+=40){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
  for(let y=0;y<H;y+=40){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}

  // Bricks
  bricks.forEach(b=>{
    if(!b.hp) return;
    ctx.globalAlpha=b.hp<b.maxHp?0.5:1;
    ctx.fillStyle=b.color;
    ctx.beginPath(); ctx.roundRect(b.x,b.y,BW,BH,4); ctx.fill();
    ctx.fillStyle='rgba(255,255,255,0.18)';
    ctx.beginPath(); ctx.roundRect(b.x+2,b.y+2,BW-4,BH/3,2); ctx.fill();
    ctx.globalAlpha=1;
  });

  // Paddle — blue glow
  ctx.shadowColor='#3b82f6'; ctx.shadowBlur=10;
  const pg=ctx.createLinearGradient(paddle.x,paddle.y,paddle.x,paddle.y+paddle.h);
  pg.addColorStop(0,'#60a5fa'); pg.addColorStop(1,'#2563eb');
  ctx.fillStyle=pg;
  ctx.beginPath(); ctx.roundRect(paddle.x,paddle.y,paddle.w,paddle.h,6); ctx.fill();
  ctx.shadowBlur=0;

  // Ball — white with blue glow
  ctx.shadowColor='#93c5fd'; ctx.shadowBlur=12;
  ctx.beginPath(); ctx.arc(ball.x,ball.y,ball.r,0,Math.PI*2);
  ctx.fillStyle='#e8eaf0'; ctx.fill();
  ctx.shadowBlur=0;
  ctx.beginPath(); ctx.arc(ball.x-ball.r*0.3,ball.y-ball.r*0.3,ball.r*0.35,0,Math.PI*2);
  ctx.fillStyle='rgba(255,255,255,0.6)'; ctx.fill();

  // Launch hint
  if(!launched&&running){
    ctx.fillStyle='rgba(232,234,240,0.35)'; ctx.font='500 0.85rem Syne,sans-serif'; ctx.textAlign='center';
    ctx.fillText('Click or tap to launch',W/2,H/2); ctx.textAlign='left';
  }
}

canvas.addEventListener('mousemove',e=>{
  if(!running) return;
  const r=canvas.getBoundingClientRect();
  paddle.x=e.clientX-r.left-paddle.w/2;
  paddle.x=Math.max(0,Math.min(W-paddle.w,paddle.x));
});
canvas.addEventListener('touchmove',e=>{
  e.preventDefault();
  const r=canvas.getBoundingClientRect();
  paddle.x=e.touches[0].clientX-r.left-paddle.w/2;
  paddle.x=Math.max(0,Math.min(W-paddle.w,paddle.x));
},{passive:false});

ctx.fillStyle='#0d1117'; ctx.fillRect(0,0,W,H);
ctx.fillStyle='#4a4f63'; ctx.font='500 0.9rem Syne,sans-serif'; ctx.textAlign='center';
ctx.fillText('Press New Game to start',W/2,H/2); ctx.textAlign='left';
</script>
</body>
</html>
