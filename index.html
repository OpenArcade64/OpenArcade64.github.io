<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multiplayer Canvas</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #222;
            color: white;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        #ui-layer {
            position: absolute;
            top: 10px;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px 20px;
            border-radius: 8px;
            pointer-events: none; /* Lets you draw under the text */
        }
        canvas {
            background-color: #ffffff;
            cursor: crosshair;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <div id="ui-layer">
        <h3 style="margin: 0;" id="statusText">Connecting to multiplayer...</h3>
    </div>

    <canvas id="drawingCanvas"></canvas>

    <script>
        // --- 1. SUPABASE CONNECTION ---
        const supabaseUrl = 'https://acfrhcblcogfywiivfai.supabase.co';
        const supabaseKey = 'sb_publishable_bICLUE7sf8b2aifcCRvVBA_cvxdclPp'; 
        const db = window.supabase.createClient(supabaseUrl, supabaseKey);

        // --- 2. CANVAS SETUP ---
        const canvas = document.getElementById('drawingCanvas');
        const ctx = canvas.getContext('2d');
        const statusText = document.getElementById('statusText');

        // Make canvas fill the screen
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        // Drawing Settings
        ctx.lineWidth = 5;
        ctx.lineCap = 'round';
        ctx.strokeStyle = '#000000'; // Black ink

        let isDrawing = false;
        let lastX = 0;
        let lastY = 0;

        // --- 3. MULTIPLAYER BROADCAST SETUP ---
        // We create a "room" that everyone connects to
        const room = db.channel('global_whiteboard');

        // Listen for other people's drawings
        room.on('broadcast', { event: 'draw' }, (payload) => {
            const data = payload.payload;
            // Draw their line on our screen (set 'emit' to false so we don't create an infinite loop)
            drawLine(data.x0, data.y0, data.x1, data.y1, false);
        });

        // Actually connect to the room
        room.subscribe((status) => {
            if (status === 'SUBSCRIBED') {
                statusText.innerText = "Multiplayer Live! Start drawing.";
                statusText.style.color = "#44ff44";
            }
        });

        // --- 4. DRAWING LOGIC ---
        // Function that physically draws the line on the screen
        function drawLine(x0, y0, x1, y1, emit) {
            ctx.beginPath();
            ctx.moveTo(x0, y0);
            ctx.lineTo(x1, y1);
            ctx.stroke();
            ctx.closePath();

            // If we drew this locally, broadcast it to everyone else
            if (emit) {
                room.send({
                    type: 'broadcast',
                    event: 'draw',
                    payload: { x0, y0, x1, y1 }
                });
            }
        }

        // Mouse Events
        canvas.addEventListener('mousedown', (e) => {
            isDrawing = true;
            lastX = e.clientX;
            lastY = e.clientY;
        });

        canvas.addEventListener('mousemove', (e) => {
            if (!isDrawing) return;
            // Draw the line from where the mouse was to where it is now
            drawLine(lastX, lastY, e.clientX, e.clientY, true);
            lastX = e.clientX;
            lastY = e.clientY;
        });

        window.addEventListener('mouseup', () => {
            isDrawing = false;
        });

        // Handle window resizing
        window.addEventListener('resize', () => {
            // Note: Resizing clears the canvas natively in HTML5
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            ctx.lineWidth = 5;
            ctx.lineCap = 'round';
            ctx.strokeStyle = '#000000';
        });
    </script>
</body>
</html>
