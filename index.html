<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multiplayer Canvas - Permanent</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #222;
            color: white;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        #ui-layer {
            position: absolute;
            top: 10px;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px 20px;
            border-radius: 8px;
            pointer-events: none;
            z-index: 10;
        }
        canvas {
            background-color: #ffffff;
            cursor: crosshair;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            position: absolute;
            top: 0;
            left: 0;
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <div id="ui-layer">
        <h3 style="margin: 0;" id="statusText">Loading saved canvas...</h3>
    </div>

    <canvas id="drawingCanvas"></canvas>

    <script>
        // --- 1. SUPABASE CONNECTION ---
        const supabaseUrl = 'https://acfrhcblcogfywiivfai.supabase.co';
        const supabaseKey = 'sb_publishable_bICLUE7sf8b2aifcCRvVBA_cvxdclPp'; 
        const db = window.supabase.createClient(supabaseUrl, supabaseKey);

        // --- 2. CANVAS SETUP ---
        const canvas = document.getElementById('drawingCanvas');
        const ctx = canvas.getContext('2d');
        const statusText = document.getElementById('statusText');

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        ctx.lineWidth = 5;
        ctx.lineCap = 'round';
        ctx.strokeStyle = '#000000'; 

        let isDrawing = false;
        let lastX = 0;
        let lastY = 0;

        // --- 3. LOAD PERMANENT DATA ON STARTUP ---
        async function loadSavedCanvas() {
            // Get the absolute newest row from the whiteboard table
            const { data, error } = await db
                .from('whiteboard')
                .select('image_data')
                .order('id', { ascending: false })
                .limit(1);

            if (data && data.length > 0 && data[0].image_data) {
                // Convert the saved text back into an image
                const img = new Image();
                img.onload = () => {
                    ctx.drawImage(img, 0, 0);
                    statusText.innerText = "Multiplayer Live! Start drawing.";
                    statusText.style.color = "#44ff44";
                };
                img.src = data[0].image_data;
            } else {
                statusText.innerText = "Multiplayer Live! Start drawing.";
                statusText.style.color = "#44ff44";
            }
        }
        loadSavedCanvas();

        // --- 4. MULTIPLAYER BROADCAST ---
        const room = db.channel('global_whiteboard');
        room.on('broadcast', { event: 'draw' }, (payload) => {
            const data = payload.payload;
            drawLine(data.x0, data.y0, data.x1, data.y1, false);
        });
        room.subscribe();

        // --- 5. DRAWING & SAVING LOGIC ---
        function drawLine(x0, y0, x1, y1, emit) {
            ctx.beginPath();
            ctx.moveTo(x0, y0);
            ctx.lineTo(x1, y1);
            ctx.stroke();
            ctx.closePath();

            if (emit) {
                room.send({
                    type: 'broadcast',
                    event: 'draw',
                    payload: { x0, y0, x1, y1 }
                });
            }
        }

        canvas.addEventListener('mousedown', (e) => {
            isDrawing = true;
            lastX = e.clientX;
            lastY = e.clientY;
        });

        canvas.addEventListener('mousemove', (e) => {
            if (!isDrawing) return;
            drawLine(lastX, lastY, e.clientX, e.clientY, true);
            lastX = e.clientX;
            lastY = e.clientY;
        });

        // When you lift the mouse, save the canvas state to the database
        window.addEventListener('mouseup', async () => {
            if (isDrawing) {
                isDrawing = false;
                
                // Convert the entire canvas into a Base64 text string
                const canvasData = canvas.toDataURL(); 
                
                // Upload it to Supabase secretly in the background
                await db.from('whiteboard').insert([{ image_data: canvasData }]);
            }
        });

        window.addEventListener('resize', () => {
            // Because resizing wipes the canvas, we just reload the page to fetch the saved state
            window.location.reload(); 
        });
    </script>
</body>
</html>
