<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geometry Dash HTML5</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #222;
            color: white;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        canvas {
            background-color: #1a1a1a;
            border: 2px solid #555;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }
        #ui-layer {
            margin-top: 20px;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
        }
        button:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>

    <canvas id="gameCanvas" width="800" height="450"></canvas>

    <div id="ui-layer">
        <button id="testDbBtn">Test Cloud Connection</button>
        <p id="statusText">Waiting to test...</p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
        // Supabase configuration using your provided keys
        const supabaseUrl = 'https://acfrhcblcogfywiivfai.supabase.co';
        const supabaseKey = 'sb_publishable_bICLUE7sf8b2aifcCRvVBA_cvxdclPp'; 
        
        // Connect to the database
        const db = window.supabase.createClient(supabaseUrl, supabaseKey);

        // Test Connection Function
        document.getElementById('testDbBtn').addEventListener('click', async () => {
            const statusText = document.getElementById('statusText');
            statusText.innerText = "Sending test level to cloud...";

            const testLevelData = {
                level_name: "My First Connection Test",
                author: "Dev",
                level_data: JSON.stringify({ objects: [], settings: { bg: "blue" } })
            };

            const { data, error } = await db
                .from('levels')
                .insert([testLevelData]);

            if (error) {
                console.error("Database Error:", error);
                statusText.innerText = "Error! Check the console (F12).";
                statusText.style.color = "#ff4444";
            } else {
                console.log("Success! Data sent to Supabase.");
                statusText.innerText = "Success! Check your Supabase Table Editor!";
                statusText.style.color = "#44ff44";
            }
        });

        // Basic Canvas Setup (The green square)
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        ctx.fillStyle = '#00ff00';
        ctx.fillRect(100, 350, 30, 30); 
        
        ctx.fillStyle = '#ffffff';
        ctx.font = '20px Arial';
        ctx.fillText('Game Engine Ready', 300, 225);
    </script>
</body>
</html>
