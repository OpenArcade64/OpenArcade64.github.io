<script>
    // --- 1. SETUP CLOUD DATABASE ---
    // REPLACE THESE WITH YOUR ACTUAL SUPABASE DETAILS
    const supabaseUrl = 'YOUR_SUPABASE_PROJECT_URL';
    const supabaseKey = 'YOUR_PUBLISHABLE_KEY'; 
    
    // FIX: Renamed the connection to 'db' so it doesn't clash with the Supabase library
    const db = window.supabase.createClient(supabaseUrl, supabaseKey);

    // --- 2. TEST CONNECTION FUNCTION ---
    document.getElementById('testDbBtn').addEventListener('click', async () => {
        const statusText = document.getElementById('statusText');
        statusText.innerText = "Sending test level to cloud...";

        const testLevelData = {
            level_name: "My First Connection Test",
            author: "Dev",
            level_data: JSON.stringify({ objects: [], settings: { bg: "blue" } })
        };

        // FIX: Use 'db' here instead of 'supabase'
        const { data, error } = await db
            .from('levels')
            .insert([testLevelData]);

        if (error) {
            console.error("Database Error:", error);
            statusText.innerText = "Error! Check the console (F12).";
            statusText.style.color = "#ff4444";
        } else {
            console.log("Success! Data sent to Supabase.");
            statusText.innerText = "Success! Check your Supabase Table Editor!";
            statusText.style.color = "#44ff44";
        }
    });

    // --- 3. BASIC CANVAS SETUP ---
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    ctx.fillStyle = '#00ff00';
    ctx.fillRect(100, 350, 30, 30); 
    
    ctx.fillStyle = '#ffffff';
    ctx.font = '20px Arial';
    ctx.fillText('Game Engine Ready', 300, 225);
</script>
