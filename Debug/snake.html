<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snake — OpenArcade64</title>
<link rel="stylesheet" href="style.css">
<style>
  #snake-canvas { background: #0d1117; display: block; margin: 0 auto; }
  .center-canvas { display: flex; justify-content: center; }
</style>
</head>
<body>

<nav class="site-nav">
  <a class="nav-logo" href="index.html">OpenArcade<span class="logo-64">64</span></a>
  <ul class="nav-links">
    <li><a href="index.html">Home</a></li>
    <li><a href="snake.html" class="active">Snake</a></li>
    <li><a href="tetris.html">Tetris</a></li>
    <li><a href="breakout.html">Breakout</a></li>
  </ul>
</nav>

<main>
  <div class="game-page">
    <div class="game-page-header">
      <h1>🐍 Snake</h1>
      <p>Eat the food to grow. Don't hit the walls or yourself. Speed increases with score.</p>
    </div>
    <div class="game-container">
      <div class="game-hud">
        <div class="hud-stat"><span class="label">Score</span><span class="value" id="score">0</span></div>
        <div class="hud-stat"><span class="label">Best</span><span class="value" id="best">0</span></div>
        <div class="hud-stat"><span class="label">Speed</span><span class="value" id="speed">1</span></div>
        <div class="hud-spacer"></div>
        <button class="btn btn-ghost" id="pause-btn" onclick="togglePause()">Pause</button>
        <button class="btn btn-primary" onclick="startGame()">New Game</button>
      </div>
      <div class="center-canvas">
        <canvas id="snake-canvas" width="420" height="420"></canvas>
      </div>
      <div class="game-status" id="game-status"></div>
      <div class="controls-hint">
        <span class="key-hint">↑ ↓ ← →</span>
        <span class="key-hint">W A S D</span>
        <span class="key-hint">Space — Pause</span>
      </div>
    </div>
  </div>
</main>

<footer class="site-footer">
  <a href="index.html" style="color:inherit;text-decoration:none">← All games</a>
  <span>OpenArcade64</span>
</footer>

<script>
const COLS = 21, ROWS = 21, CELL = 20;
const canvas = document.getElementById('snake-canvas');
const ctx = canvas.getContext('2d');

let snake, dir, nextDir, food, score, best = 0, gameLoop, paused, alive;

function startGame() {
  clearInterval(gameLoop);
  snake = [{x:10,y:10},{x:9,y:10},{x:8,y:10},{x:7,y:10}];
  dir = {x:1,y:0}; nextDir = {x:1,y:0};
  score = 0; paused = false; alive = true;
  document.getElementById('score').textContent = 0;
  document.getElementById('speed').textContent = 1;
  document.getElementById('pause-btn').textContent = 'Pause';
  setStatus('');
  placeFood();
  gameLoop = setInterval(step, 140);
  draw();
}

function placeFood() {
  let pos;
  do { pos = {x:Math.floor(Math.random()*COLS), y:Math.floor(Math.random()*ROWS)}; }
  while (snake.some(s => s.x===pos.x && s.y===pos.y));
  food = pos;
}

function step() {
  if (!alive || paused) return;
  dir = nextDir;
  const head = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};
  if (head.x<0||head.x>=COLS||head.y<0||head.y>=ROWS||snake.some(s=>s.x===head.x&&s.y===head.y)) {
    alive = false; clearInterval(gameLoop);
    setStatus('lose', '💀 Game over — Score: ' + score);
    draw(); return;
  }
  snake.unshift(head);
  if (head.x===food.x && head.y===food.y) {
    score += 10;
    if (score > best) { best = score; document.getElementById('best').textContent = best; }
    document.getElementById('score').textContent = score;
    const lvl = Math.floor(score/50)+1;
    document.getElementById('speed').textContent = lvl;
    clearInterval(gameLoop);
    gameLoop = setInterval(step, Math.max(55, 140-(lvl-1)*12));
    placeFood();
  } else { snake.pop(); }
  draw();
}

function draw() {
  ctx.fillStyle = '#0d1117';
  ctx.fillRect(0,0,canvas.width,canvas.height);

  // Grid dots
  ctx.fillStyle = '#161b22';
  for (let x=0;x<COLS;x++) for (let y=0;y<ROWS;y++) {
    ctx.beginPath(); ctx.arc(x*CELL+CELL/2, y*CELL+CELL/2, 0.8, 0, Math.PI*2); ctx.fill();
  }

  // Food — blue glow
  const fx = food.x*CELL, fy = food.y*CELL;
  ctx.shadowColor = '#3b82f6'; ctx.shadowBlur = 12;
  ctx.fillStyle = '#60a5fa';
  ctx.beginPath(); ctx.roundRect(fx+3, fy+3, CELL-6, CELL-6, 4); ctx.fill();
  ctx.shadowBlur = 0;

  // Snake
  snake.forEach((seg, i) => {
    const x = seg.x*CELL, y = seg.y*CELL;
    const isHead = i === 0;
    ctx.fillStyle = isHead ? '#3b82f6' : (i%2===0 ? '#1d4ed8' : '#2563eb');
    if (isHead) { ctx.shadowColor = '#3b82f6'; ctx.shadowBlur = 8; }
    ctx.beginPath(); ctx.roundRect(x+1, y+1, CELL-2, CELL-2, isHead ? 6 : 3); ctx.fill();
    ctx.shadowBlur = 0;

    if (isHead) {
      // Eyes
      ctx.fillStyle = '#fff';
      const ex = dir.x===0 ? [x+5,x+14] : dir.x>0 ? [x+13,x+13] : [x+6,x+6];
      const ey = dir.y===0 ? [y+5,y+14] : dir.y>0 ? [y+13,y+13] : [y+6,y+6];
      ctx.beginPath(); ctx.arc(ex[0], ey[0], 2.2, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(ex[1], ey[1], 2.2, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#0f172a';
      ctx.beginPath(); ctx.arc(ex[0]+dir.x, ey[0]+dir.y, 1.1, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(ex[1]+dir.x, ey[1]+dir.y, 1.1, 0, Math.PI*2); ctx.fill();
    }
  });

  if (paused && alive) {
    ctx.fillStyle = 'rgba(13,17,23,0.82)'; ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.fillStyle = '#3b82f6';
    ctx.font = 'bold 1.3rem Syne, sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('PAUSED', canvas.width/2, canvas.height/2); ctx.textAlign = 'left';
  }
}

function togglePause() {
  if (!alive) return;
  paused = !paused;
  document.getElementById('pause-btn').textContent = paused ? 'Resume' : 'Pause';
  draw();
}

function setStatus(type, msg) {
  const el = document.getElementById('game-status');
  el.className = 'game-status' + (type ? ' '+type : '');
  el.textContent = msg || '';
}

document.addEventListener('keydown', e => {
  const map = {ArrowUp:{x:0,y:-1},ArrowDown:{x:0,y:1},ArrowLeft:{x:-1,y:0},ArrowRight:{x:1,y:0},w:{x:0,y:-1},s:{x:0,y:1},a:{x:-1,y:0},d:{x:1,y:0}};
  if (e.key===' ') { e.preventDefault(); togglePause(); return; }
  const nd = map[e.key]; if (!nd) return; e.preventDefault();
  if (nd.x !== -dir.x || nd.y !== -dir.y) nextDir = nd;
});

let tx, ty;
canvas.addEventListener('touchstart', e => { tx=e.touches[0].clientX; ty=e.touches[0].clientY; }, {passive:true});
canvas.addEventListener('touchend', e => {
  const dx=e.changedTouches[0].clientX-tx, dy=e.changedTouches[0].clientY-ty;
  if (Math.abs(dx)>Math.abs(dy)) { const d=dx>0?{x:1,y:0}:{x:-1,y:0}; if(d.x!==-dir.x) nextDir=d; }
  else { const d=dy>0?{x:0,y:1}:{x:0,y:-1}; if(d.y!==-dir.y) nextDir=d; }
}, {passive:true});

// Idle draw
ctx.fillStyle='#0d1117'; ctx.fillRect(0,0,canvas.width,canvas.height);
ctx.fillStyle='#4a4f63'; ctx.font='500 0.9rem Syne, sans-serif'; ctx.textAlign='center';
ctx.fillText('Press New Game to start', canvas.width/2, canvas.height/2); ctx.textAlign='left';
</script>
</body>
</html>
