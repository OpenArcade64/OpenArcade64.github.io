<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tetris — OpenArcade64</title>
<link rel="stylesheet" href="../style.css">
<style>
  .tetris-layout { display:flex; gap:1.25rem; align-items:flex-start; justify-content:center; flex-wrap:wrap; }
  #tetris-canvas { background:#0d1117; flex-shrink:0; }
  .tetris-sidebar { display:flex; flex-direction:column; gap:0.75rem; min-width:130px; }
  .side-panel { background:var(--surface2); border:1px solid var(--border); border-radius:var(--radius-sm); padding:0.8rem 1rem; }
  .side-label { font-size:0.65rem; font-weight:700; text-transform:uppercase; letter-spacing:0.08em; color:var(--text-3); margin-bottom:0.4rem; }
  .side-value { font-family:'JetBrains Mono',monospace; font-size:1.3rem; font-weight:500; color:var(--blue-bright); }
  #next-canvas { background:var(--bg); border:1px solid var(--border); border-radius:var(--radius-sm); display:block; margin-top:0.5rem; }
</style>
</head>
<body>

<nav class="site-nav">
  <a class="nav-logo" href="../index.html">OpenArcade<span class="logo-64">64</span></a>
  <ul class="nav-links">
    <li><a href="../index.html">Home</a></li>
    <li><a href="snake.html">Snake</a></li>
    <li><a href="tetris.html" class="active">Tetris</a></li>
    <li><a href="breakout.html">Breakout</a></li>
  </ul>
</nav>

<main>
  <div class="game-page">
    <div class="game-page-header">
      <h1>🟦 Tetris</h1>
      <p>Fill rows to clear them. Speed increases every 10 lines. Don't let it reach the top.</p>
    </div>
    <div class="game-container">
      <div class="game-hud">
        <div class="hud-spacer"></div>
        <button class="btn btn-ghost" id="pause-btn" onclick="togglePause()">Pause</button>
        <button class="btn btn-primary" onclick="startGame()">New Game</button>
      </div>

      <div class="tetris-layout">
        <canvas id="tetris-canvas" width="200" height="400"></canvas>
        <div class="tetris-sidebar">
          <div class="side-panel"><div class="side-label">Score</div><div class="side-value" id="t-score">0</div></div>
          <div class="side-panel"><div class="side-label">Lines</div><div class="side-value" id="t-lines">0</div></div>
          <div class="side-panel"><div class="side-label">Level</div><div class="side-value" id="t-level">1</div></div>
          <div class="side-panel"><div class="side-label">Best</div><div class="side-value" id="t-best">0</div></div>
          <div class="side-panel"><div class="side-label">Next</div><canvas id="next-canvas" width="100" height="80"></canvas></div>
        </div>
      </div>

      <div class="game-status" id="game-status"></div>

      <div class="controls-hint">
        <span class="key-hint">← → Move</span>
        <span class="key-hint">↑ / Z  Rotate</span>
        <span class="key-hint">↓  Soft drop</span>
        <span class="key-hint">Space  Hard drop</span>
        <span class="key-hint">P  Pause</span>
      </div>
    </div>
  </div>
</main>

<footer class="site-footer">
  <a href="../index.html" style="color:inherit;text-decoration:none">← All games</a>
  <span>OpenArcade64</span>
</footer>

<script>
const COLS=10, ROWS=20, CELL=20;
const canvas=document.getElementById('tetris-canvas');
const ctx=canvas.getContext('2d');
const nc=document.getElementById('next-canvas');
const nctx=nc.getContext('2d');

const PIECES=[
  {shape:[[1,1,1,1]],color:'#06b6d4'},
  {shape:[[1,1],[1,1]],color:'#f59e0b'},
  {shape:[[0,1,0],[1,1,1]],color:'#a78bfa'},
  {shape:[[1,0,0],[1,1,1]],color:'#3b82f6'},
  {shape:[[0,0,1],[1,1,1]],color:'#f97316'},
  {shape:[[0,1,1],[1,1,0]],color:'#22c55e'},
  {shape:[[1,1,0],[0,1,1]],color:'#ef4444'},
];

let board, current, next, score, lines, level, best=0, dropTimer, paused, alive;

function startGame() {
  clearInterval(dropTimer);
  board=Array.from({length:ROWS},()=>Array(COLS).fill(0));
  score=0; lines=0; level=1; paused=false; alive=true;
  updateHUD(); setStatus('');
  document.getElementById('pause-btn').textContent='Pause';
  next=randPiece(); spawn(); dropTimer=setInterval(drop,spd());
}

const spd=()=>Math.max(75,600-(level-1)*55);
const randPiece=()=>{const p=PIECES[Math.floor(Math.random()*PIECES.length)]; return{shape:p.shape.map(r=>[...r]),color:p.color,x:0,y:0};};

function spawn() {
  current=next; current.x=Math.floor((COLS-current.shape[0].length)/2); current.y=0;
  next=randPiece(); drawNext();
  if (!can(current,current.x,current.y)) {
    alive=false; clearInterval(dropTimer);
    if(score>best){best=score;document.getElementById('t-best').textContent=best;}
    setStatus('lose','💀 Game over — Score: '+score);
  }
}

const can=(p,nx,ny)=>p.shape.every((row,r)=>row.every((v,c)=>{
  if(!v) return true;
  const bx=nx+c,by=ny+r;
  return bx>=0&&bx<COLS&&by>=0&&by<ROWS&&!board[by][bx];
}));

function place() {
  current.shape.forEach((row,r)=>row.forEach((v,c)=>{if(v) board[current.y+r][current.x+c]=current.color;}));
  let cleared=0;
  for(let r=ROWS-1;r>=0;r--){if(board[r].every(v=>v)){board.splice(r,1);board.unshift(Array(COLS).fill(0));cleared++;r++;}}
  if(cleared){const pts=[0,100,300,500,800][cleared]*level;score+=pts;lines+=cleared;level=Math.floor(lines/10)+1;clearInterval(dropTimer);dropTimer=setInterval(drop,spd());updateHUD();}
  spawn();
}

function drop() { if(!alive||paused) return; can(current,current.x,current.y+1)?current.y++:place(); drawBoard(); }

function updateHUD() {
  document.getElementById('t-score').textContent=score;
  document.getElementById('t-lines').textContent=lines;
  document.getElementById('t-level').textContent=level;
}

function hardDrop() { while(can(current,current.x,current.y+1)){current.y++;score+=2;} place(); updateHUD(); drawBoard(); }

function rot(p) {
  const m=p.shape,r=m.length,c=m[0].length;
  return Array.from({length:c},(_,ri)=>Array.from({length:r},(_,ci)=>m[r-1-ci][ri]));
}

function drawCell(c2,x,y,color,cs) {
  c2.fillStyle=color;
  c2.beginPath(); c2.roundRect(x*cs+1,y*cs+1,cs-2,cs-2,3); c2.fill();
  c2.fillStyle='rgba(255,255,255,0.12)';
  c2.beginPath(); c2.roundRect(x*cs+2,y*cs+2,cs-4,(cs-4)/3,2); c2.fill();
}

function drawBoard() {
  ctx.fillStyle='#0d1117'; ctx.fillRect(0,0,canvas.width,canvas.height);

  // Grid
  ctx.strokeStyle='#161b22'; ctx.lineWidth=0.5;
  for(let x=0;x<=COLS;x++){ctx.beginPath();ctx.moveTo(x*CELL,0);ctx.lineTo(x*CELL,ROWS*CELL);ctx.stroke();}
  for(let y=0;y<=ROWS;y++){ctx.beginPath();ctx.moveTo(0,y*CELL);ctx.lineTo(COLS*CELL,y*CELL);ctx.stroke();}

  board.forEach((row,r)=>row.forEach((v,c)=>{if(v) drawCell(ctx,c,r,v,CELL);}));
  if(!alive) return;

  // Ghost
  let gy=current.y;
  while(can(current,current.x,gy+1)) gy++;
  current.shape.forEach((row,r)=>row.forEach((v,c)=>{
    if(!v) return;
    ctx.fillStyle='rgba(255,255,255,0.06)';
    ctx.beginPath(); ctx.roundRect((current.x+c)*CELL+1,(gy+r)*CELL+1,CELL-2,CELL-2,3); ctx.fill();
  }));

  current.shape.forEach((row,r)=>row.forEach((v,c)=>{if(v) drawCell(ctx,current.x+c,current.y+r,current.color,CELL);}));

  if(paused){
    ctx.fillStyle='rgba(13,17,23,0.85)'; ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.fillStyle='#3b82f6'; ctx.font='bold 1.1rem Syne,sans-serif'; ctx.textAlign='center';
    ctx.fillText('PAUSED',canvas.width/2,canvas.height/2); ctx.textAlign='left';
  }
}

function drawNext() {
  nctx.fillStyle='#0a0c10'; nctx.fillRect(0,0,nc.width,nc.height);
  const cs=16, ox=Math.floor((nc.width/cs-next.shape[0].length)/2), oy=Math.floor((nc.height/cs-next.shape.length)/2);
  next.shape.forEach((row,r)=>row.forEach((v,c)=>{if(v) drawCell(nctx,ox+c,oy+r,next.color,cs);}));
}

function togglePause() {
  if(!alive) return; paused=!paused;
  document.getElementById('pause-btn').textContent=paused?'Resume':'Pause';
  drawBoard();
}

function setStatus(type,msg) {
  const el=document.getElementById('game-status');
  el.className='game-status'+(type?' '+type:''); el.textContent=msg||'';
}

document.addEventListener('keydown',e=>{
  if(!alive) return;
  if(e.key==='p'||e.key==='P'){togglePause();return;}
  if(paused) return;
  if(e.key==='ArrowLeft'){if(can(current,current.x-1,current.y))current.x--;}
  else if(e.key==='ArrowRight'){if(can(current,current.x+1,current.y))current.x++;}
  else if(e.key==='ArrowDown'){if(can(current,current.x,current.y+1)){current.y++;score++;updateHUD();}}
  else if(e.key==='ArrowUp'||e.key==='z'||e.key==='Z'){
    const r=rot(current),tmp={...current,shape:r};
    if(can(tmp,current.x,current.y))current.shape=r;
    else if(can(tmp,current.x+1,current.y)){current.shape=r;current.x++;}
    else if(can(tmp,current.x-1,current.y)){current.shape=r;current.x--;}
  }
  else if(e.key===' '){e.preventDefault();hardDrop();return;}
  else return;
  e.preventDefault(); drawBoard();
});

ctx.fillStyle='#0d1117'; ctx.fillRect(0,0,canvas.width,canvas.height);
ctx.fillStyle='#4a4f63'; ctx.font='500 0.85rem Syne,sans-serif'; ctx.textAlign='center';
ctx.fillText('Press New Game to start',canvas.width/2,canvas.height/2); ctx.textAlign='left';
nctx.fillStyle='#0a0c10'; nctx.fillRect(0,0,nc.width,nc.height);
</script>
</body>
</html>
