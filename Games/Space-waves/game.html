<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Space Waves — OpenArcade64</title>
<link rel="stylesheet" href="../../style.css">
<link id="level-stylesheet" rel="stylesheet" href="">
<style>
  #wave-canvas { display:block; margin:0 auto; background:#020408; }
  .canvas-wrap  { position:relative; display:flex; justify-content:center; }

  #death-overlay {
    position:absolute; inset:0;
    display:none; flex-direction:column;
    align-items:center; justify-content:center; gap:.7rem;
    background:rgba(2,4,8,0.75);
    border-radius:var(--radius-sm);
    pointer-events:none;
  }
  #death-overlay.show { display:flex; }

  #death-dist {
    font-family:'JetBrains Mono',monospace;
    font-size:1.5rem; font-weight:700; color:#ef4444;
  }
  #death-new-best {
    font-size:.78rem; font-weight:700;
    color:#f59e0b; text-transform:uppercase; letter-spacing:.06em;
  }
  #death-sub { font-size:.8rem; color:var(--text-2); }
</style>
</head>
<body>

<nav class="site-nav">
  <a class="nav-logo" href="../../index.html">OpenArcade<span class="logo-64">64</span></a>
  <ul class="nav-links">
    <li><a href="../../index.html">Home</a></li>
    <li><a href="index.html">Space Waves</a></li>
    <li><a href="#" id="nav-level-name" class="active">—</a></li>
  </ul>
</nav>

<main>
  <div class="game-page">
    <div class="game-page-header">
      <h1>〰️ <span id="level-title">Space Waves</span></h1>
      <p>Hold Space / ↑ / tap to go up. Release to drop.</p>
    </div>

    <div class="game-container">
      <div class="game-hud">
        <div class="hud-stat"><span class="label">Distance</span><span class="value" id="hud-dist">0</span></div>
        <div class="hud-stat"><span class="label">Best</span><span class="value" id="hud-best">—</span></div>
        <div class="hud-spacer"></div>
        <a class="btn btn-ghost" href="index.html">Levels</a>
        <button class="btn btn-primary" onclick="manualStart()">Restart</button>
      </div>

      <div class="canvas-wrap">
        <canvas id="wave-canvas" width="640" height="360"></canvas>
        <div id="death-overlay">
          <div id="death-dist"></div>
          <div id="death-new-best" style="display:none">★ New Best!</div>
          <div id="death-sub">Restarting…</div>
        </div>
      </div>

      <div class="controls-hint">
        <span class="key-hint">Hold Space / ↑ — Go up</span>
        <span class="key-hint">Release — Go down</span>
        <span class="key-hint">Tap canvas — Go up</span>
      </div>
    </div>
  </div>
</main>

<footer class="site-footer">
  <a href="index.html" style="color:inherit;text-decoration:none">← Level Select</a>
  <span>OpenArcade64</span>
</footer>

<script>
// ── URL params ────────────────────────────────────────────────
const params    = new URLSearchParams(location.search);
const levelFile = params.get('level') || 'levels/level-1.css';
const levelId   = params.get('id')    || 'level-1';

document.getElementById('level-stylesheet').href = levelFile;

// ── High score ────────────────────────────────────────────────
const HS_KEY = 'sw-hs-' + levelId;
function getHS()  { return parseInt(localStorage.getItem(HS_KEY) || '0'); }
function saveHS(v){ localStorage.setItem(HS_KEY, v); }

// ── Canvas ────────────────────────────────────────────────────
const canvas = document.getElementById('wave-canvas');
const ctx    = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

// ── CSS helpers (read after level sheet loads) ─────────────────
function cssVar(n, fb) {
  const v = getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  return v || (fb !== undefined ? String(fb) : '');
}
function cssNum(n, fb) { return parseFloat(cssVar(n, fb)) || fb; }

function loadLevelSegs() {
  const count = Math.max(1, cssNum('--level-segment-count', 1));
  const segs = [];
  for (let i = 1; i <= count; i++) {
    segs.push({
      width:  cssNum(`--seg-${i}-width`,  200),
      top:    cssNum(`--seg-${i}-top`,    0.15),
      bottom: cssNum(`--seg-${i}-bottom`, 0.85),
      color:  cssVar(`--seg-${i}-color`,  cssVar('--wall-default-color', '#1e3a5f')),
    });
  }
  return segs;
}

let SCROLL, SPEED, BG;
function loadGlobals() {
  SCROLL = cssNum('--level-scroll-speed', 3);
  SPEED  = cssNum('--ship-speed',         4);
  BG     = cssVar('--bg-color',           '#020408');
  canvas.style.background = BG;
}

// ── Stars ─────────────────────────────────────────────────────
const stars = Array.from({length:120}, () => ({
  x:Math.random()*W, y:Math.random()*H,
  r:Math.random()*1.5+0.3, spd:Math.random()*1.5+0.3,
  op:Math.random()*0.6+0.2,
}));
function tickStars() { stars.forEach(s => { s.x -= s.spd*(SCROLL/4); if(s.x<0){s.x=W;s.y=Math.random()*H;} }); }
function drawStars() { stars.forEach(s => { ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,Math.PI*2); ctx.fillStyle=`rgba(200,220,255,${s.op})`; ctx.fill(); }); }

// ── Ship ──────────────────────────────────────────────────────
function drawShip(x, y, a) {
  ctx.save(); ctx.translate(x,y); ctx.rotate(a);
  ctx.shadowColor='#60a5fa'; ctx.shadowBlur=18;
  ctx.beginPath(); ctx.moveTo(14,0); ctx.lineTo(-14,-8); ctx.lineTo(-7,0); ctx.lineTo(-14,8); ctx.closePath();
  const g=ctx.createLinearGradient(-14,0,14,0); g.addColorStop(0,'#1d4ed8'); g.addColorStop(1,'#93c5fd');
  ctx.fillStyle=g; ctx.fill();
  ctx.shadowColor='#f59e0b'; ctx.shadowBlur=12; ctx.fillStyle='#fbbf24';
  ctx.beginPath(); ctx.ellipse(-9,0,5,3,0,0,Math.PI*2); ctx.fill();
  ctx.shadowBlur=0; ctx.restore();
}

// ── Trail ─────────────────────────────────────────────────────
let trail=[], trailAcc=0, pulseT=0;
function tickTrail(x,y) {
  trailAcc+=SCROLL;
  if(trailAcc>=3){trailAcc=0;trail.push({x,y});if(trail.length>48)trail.shift();}
  for(let i=0;i<trail.length-1;i++) trail[i].x-=SCROLL;
}
function drawTrail() {
  if(trail.length<2)return;
  pulseT+=0.07; const p=0.55+0.45*(0.5+0.5*Math.sin(pulseT));
  for(let i=1;i<trail.length;i++){
    const t=i/trail.length;
    ctx.beginPath(); ctx.moveTo(trail[i-1].x,trail[i-1].y); ctx.lineTo(trail[i].x,trail[i].y);
    ctx.lineWidth=1+t*5; ctx.lineCap='round';
    ctx.strokeStyle=`rgba(96,165,250,${t*p})`;
    ctx.shadowColor=t>0.7?'#93c5fd':'transparent'; ctx.shadowBlur=t>0.7?8:0; ctx.stroke();
  }
  ctx.shadowBlur=0;
}

// ── Segment queue ─────────────────────────────────────────────
let levelSegs=[], worldX=0, segQ=[];
function initQ() { segQ=[]; worldX=0; buildQ(); }
function buildQ() {
  let re=segQ.length>0?segQ[segQ.length-1].startX+segQ[segQ.length-1].width:0;
  let c=segQ.length===0?0:(segQ[segQ.length-1].si+1)%levelSegs.length;
  while(re<worldX+W+400){
    const s=levelSegs[c%levelSegs.length];
    segQ.push({si:c%levelSegs.length,startX:re,width:s.width,top:s.top,bottom:s.bottom,color:s.color});
    re+=s.width; c++;
  }
}
function tickQ() {
  worldX+=SCROLL;
  while(segQ.length>0&&segQ[0].startX+segQ[0].width<worldX) segQ.shift();
  buildQ();
}
function drawSegs() {
  segQ.forEach(s => {
    const sx=s.startX-worldX, th=s.top*H, bh=(1-s.bottom)*H;
    ctx.fillStyle=s.color;
    ctx.fillRect(sx,0,s.width,th);
    ctx.fillRect(sx,H-bh,s.width,bh);
    for(const ey of [th, H-bh]) {
      const eg=ctx.createLinearGradient(0,ey-6,0,ey+6);
      eg.addColorStop(0,'rgba(96,165,250,0)'); eg.addColorStop(0.5,'rgba(96,165,250,0.18)'); eg.addColorStop(1,'rgba(96,165,250,0)');
      ctx.fillStyle=eg; ctx.fillRect(sx,ey-6,s.width,12);
    }
  });
}
function collides(sx,sy) {
  const s=segQ.find(s=>{const x=s.startX-worldX;return sx+14>x&&sx-14<x+s.width;});
  if(!s)return false;
  return sy-8<s.top*H||sy+8>s.bottom*H;
}

// ── Game state ─────────────────────────────────────────────────
let ship, pressing=false, af, running=false, dist=0;
let angle=0, targetAngle=0, hs=0, restartTimer=null;

function initShip() { ship={x:100,y:H/2}; trail=[]; trailAcc=0; angle=0; targetAngle=0; }

function startGame() {
  if(restartTimer){clearTimeout(restartTimer);restartTimer=null;}
  cancelAnimationFrame(af);
  loadGlobals(); levelSegs=loadLevelSegs();
  initShip(); initQ();
  pressing=false; dist=0; running=true; hs=getHS();
  document.getElementById('death-overlay').classList.remove('show');
  document.getElementById('hud-dist').textContent='0';
  document.getElementById('hud-best').textContent=hs>0?hs:'—';
  loop();
}
function manualStart() { startGame(); }

function loop() { if(!running)return; tick(); draw(); af=requestAnimationFrame(loop); }

function tick() {
  if(pressing){ship.y-=SPEED;targetAngle=-0.45;}
  else{ship.y+=SPEED;targetAngle=0.45;}
  angle+=(targetAngle-angle)*0.15;
  ship.y=Math.max(8,Math.min(H-8,ship.y));
  tickTrail(ship.x,ship.y); tickQ(); tickStars();
  dist+=SCROLL;
  document.getElementById('hud-dist').textContent=Math.floor(dist/10);
  if(collides(ship.x,ship.y)){
    running=false; cancelAnimationFrame(af); draw(); onDeath();
  }
}

function onDeath() {
  const d=Math.floor(dist/10);
  let newBest=false;
  if(d>hs){hs=d;saveHS(hs);newBest=true;}
  document.getElementById('hud-best').textContent=hs>0?hs:'—';

  document.getElementById('death-dist').textContent='💥 '+d+' km';
  document.getElementById('death-new-best').style.display=newBest?'block':'none';
  document.getElementById('death-sub').textContent='Restarting in 1.5s…';
  document.getElementById('death-overlay').classList.add('show');

  restartTimer=setTimeout(()=>{
    document.getElementById('death-overlay').classList.remove('show');
    startGame();
  }, 1500);
}

function draw() {
  ctx.fillStyle=BG; ctx.fillRect(0,0,W,H);
  const nb=ctx.createRadialGradient(W*.6,H*.4,0,W*.6,H*.4,W*.55);
  nb.addColorStop(0,'rgba(30,58,138,0.12)'); nb.addColorStop(1,'transparent');
  ctx.fillStyle=nb; ctx.fillRect(0,0,W,H);
  drawStars(); drawSegs(); drawTrail(); drawShip(ship.x,ship.y,angle);
}

// ── Controls ──────────────────────────────────────────────────
document.addEventListener('keydown',e=>{if(e.key===' '||e.key==='ArrowUp'){e.preventDefault();pressing=true;}});
document.addEventListener('keyup',  e=>{if(e.key===' '||e.key==='ArrowUp') pressing=false;});
canvas.addEventListener('mousedown', ()=>pressing=true);
canvas.addEventListener('mouseup',   ()=>pressing=false);
canvas.addEventListener('mouseleave',()=>pressing=false);
canvas.addEventListener('touchstart',e=>{e.preventDefault();pressing=true;}, {passive:false});
canvas.addEventListener('touchend',  e=>{e.preventDefault();pressing=false;},{passive:false});

// ── Level metadata ────────────────────────────────────────────
fetch('levels/levels.json')
  .then(r=>r.json())
  .then(levels=>{
    const lv=levels.find(l=>l.id===levelId)||levels[0];
    if(lv){
      document.getElementById('level-title').textContent=lv.name;
      document.getElementById('nav-level-name').textContent=lv.name;
      document.title=lv.name+' — Space Waves';
    }
  }).catch(()=>{});

// ── Boot: wait for level CSS then idle-draw ───────────────────
const sheet=document.getElementById('level-stylesheet');
function boot(){
  loadGlobals(); levelSegs=loadLevelSegs(); hs=getHS();
  document.getElementById('hud-best').textContent=hs>0?hs:'—';
  ctx.fillStyle=BG; ctx.fillRect(0,0,W,H);
  drawStars(); drawShip(100,H/2,0);
  ctx.fillStyle='rgba(200,220,255,0.3)';
  ctx.font='500 0.9rem Syne,sans-serif'; ctx.textAlign='center';
  ctx.fillText('Press Restart to fly',W/2,H/2); ctx.textAlign='left';
}
sheet.addEventListener('load', boot);
sheet.addEventListener('error', boot);
if(sheet.sheet) boot();
</script>
</body>
</html>
