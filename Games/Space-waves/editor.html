<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Space Waves — Level Editor</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#080b12;--panel:#0e1420;--panel2:#141c2e;
  --border:#1e2d4a;--border2:#2a3d5e;
  --blue:#3b7ef6;--blueb:#5a9fff;--bglow:rgba(59,126,246,0.18);
  --red:#ef4444;--green:#22c55e;--amber:#f59e0b;
  --text:#dde5f4;--text2:#6e84a8;--text3:#374560;
  --mono:'Space Mono',monospace;--sans:'Space Grotesk',sans-serif;
  --r:8px;--rs:5px;
}
html,body{height:100%;}
body{background:var(--bg);color:var(--text);font-family:var(--sans);
  display:flex;flex-direction:column;height:100vh;overflow:hidden;-webkit-font-smoothing:antialiased;}

/* topbar */
.topbar{background:var(--panel);border-bottom:1px solid var(--border);
  padding:0 1rem;height:50px;display:flex;align-items:center;gap:.6rem;flex-shrink:0;}
.logo{font-family:var(--mono);font-size:.75rem;font-weight:700;color:var(--blueb);
  display:flex;align-items:center;gap:.4rem;white-space:nowrap;}
.logo .tag{background:var(--blue);color:#fff;font-size:.58rem;padding:.1rem .35rem;border-radius:3px;}
.sep{width:1px;height:22px;background:var(--border);flex-shrink:0;}
.sp{flex:1;}

.mode-tabs{display:flex;gap:2px;background:var(--panel2);border:1px solid var(--border);border-radius:var(--rs);padding:2px;}
.mtab{padding:.28rem .8rem;border-radius:4px;font-size:.76rem;font-weight:600;
  cursor:pointer;border:none;background:transparent;color:var(--text2);font-family:var(--sans);transition:all .12s;}
.mtab.active{background:var(--blue);color:#fff;}
.mtab:hover:not(.active){background:var(--border);color:var(--text);}

.btn{display:inline-flex;align-items:center;gap:.35rem;padding:.32rem .8rem;
  border-radius:var(--rs);font-family:var(--sans);font-size:.78rem;font-weight:600;
  cursor:pointer;border:1px solid transparent;transition:all .12s;white-space:nowrap;}
.bp{background:var(--blue);color:#fff;border-color:var(--blue);}
.bp:hover{background:#2563eb;}
.bg{background:transparent;color:var(--text2);border-color:var(--border2);}
.bg:hover{background:var(--panel2);color:var(--text);}
.bgreen{background:var(--green);color:#fff;border-color:var(--green);}
.bgreen:hover{background:#16a34a;}
.bdanger{background:transparent;color:var(--red);border-color:rgba(239,68,68,.3);}
.bdanger:hover{background:rgba(239,68,68,.1);}
.bsm{padding:.22rem .55rem;font-size:.72rem;}
.bicon{padding:.32rem .5rem;}

/* layout */
.workspace{display:flex;flex:1;overflow:hidden;}

/* left panel */
.lpanel{width:235px;flex-shrink:0;background:var(--panel);border-right:1px solid var(--border);
  display:flex;flex-direction:column;overflow:hidden;}
.ph{padding:.6rem .8rem;border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
.pt{font-size:.66rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--text2);}

.slist{flex:1;overflow-y:auto;padding:.35rem;display:flex;flex-direction:column;gap:2px;}
.slist::-webkit-scrollbar{width:4px;}
.slist::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px;}

.sitem{background:var(--panel2);border:1px solid var(--border);border-radius:var(--rs);
  padding:.4rem .6rem;cursor:pointer;display:flex;align-items:center;gap:.45rem;
  transition:border-color .12s,background .12s;user-select:none;}
.sitem:hover{border-color:var(--border2);background:#18223a;}
.sitem.active{border-color:var(--blue);background:var(--bglow);}
.snum{font-family:var(--mono);font-size:.6rem;color:var(--text3);width:15px;flex-shrink:0;}
.sprev{flex:1;height:22px;border-radius:3px;overflow:hidden;position:relative;background:#0a0f1a;}
.sprev-wall{position:absolute;left:0;right:0;}
.swbadge{font-family:var(--mono);font-size:.57rem;color:var(--text3);flex-shrink:0;}

/* centre */
.centre{flex:1;display:flex;flex-direction:column;overflow:hidden;background:var(--bg);}
.ctoolbar{padding:.5rem .85rem;border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:.6rem;flex-shrink:0;background:var(--panel);}
.clabel{font-size:.66rem;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--text2);}
.cwrap{flex:1;display:flex;align-items:center;justify-content:center;overflow:auto;padding:1.1rem;position:relative;}
canvas{border-radius:var(--r);border:1px solid var(--border);display:block;}
.hint{font-size:.68rem;color:var(--text3);text-align:center;padding:.25rem 0;}

/* play hud inside toolbar */
.phud{display:flex;gap:.6rem;align-items:center;flex:1;}
.pstat{font-family:var(--mono);font-size:.75rem;color:var(--text2);}
.pstat span{color:var(--blueb);}

/* death overlay */
#pdeath{position:absolute;inset:0;display:none;align-items:center;justify-content:center;
  flex-direction:column;gap:.5rem;background:rgba(2,4,8,.72);border-radius:var(--r);pointer-events:none;}
#pdeath.show{display:flex;}
#pdeath-d{font-family:var(--mono);font-size:1.2rem;font-weight:700;color:var(--red);}
#pdeath-s{font-size:.74rem;color:var(--text2);}

/* right panel */
.rpanel{width:265px;flex-shrink:0;background:var(--panel);border-left:1px solid var(--border);
  display:flex;flex-direction:column;overflow:hidden;}
.rscroll{flex:1;overflow-y:auto;padding:.85rem;display:flex;flex-direction:column;gap:1rem;}
.rscroll::-webkit-scrollbar{width:4px;}
.rscroll::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px;}

.fg{display:flex;flex-direction:column;gap:.35rem;}
.fl{font-size:.63rem;font-weight:700;text-transform:uppercase;letter-spacing:.09em;color:var(--text2);}
.frow{display:flex;gap:.45rem;align-items:center;}
.fi{flex:1;background:var(--panel2);border:1px solid var(--border2);border-radius:var(--rs);
  padding:.35rem .58rem;color:var(--text);font-family:var(--mono);font-size:.78rem;
  outline:none;transition:border-color .12s;width:100%;}
.fi:focus{border-color:var(--blue);}
input[type=range]{-webkit-appearance:none;width:100%;height:4px;background:var(--border2);border-radius:2px;outline:none;cursor:pointer;}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;border-radius:50%;background:var(--blue);border:2px solid var(--bg);cursor:pointer;}
.rrow{display:flex;align-items:center;gap:.5rem;}
.rv{font-family:var(--mono);font-size:.7rem;color:var(--blueb);width:36px;text-align:right;flex-shrink:0;}
input[type=color]{width:32px;height:25px;border:1px solid var(--border2);border-radius:var(--rs);background:var(--panel2);cursor:pointer;padding:2px;}
.divider{height:1px;background:var(--border);margin:0 -.85rem;}
.gf{display:flex;flex-direction:column;gap:.28rem;}

/* toast */
.toast{position:fixed;bottom:1.1rem;left:50%;transform:translateX(-50%) translateY(6px);
  background:var(--green);color:#fff;font-size:.78rem;font-weight:600;
  padding:.4rem 1rem;border-radius:999px;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;z-index:999;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>

<div class="topbar">
  <div class="logo">〰️ LEVEL EDITOR <span class="tag">SW</span></div>
  <div class="sep"></div>
  <div class="mode-tabs">
    <button class="mtab active" id="tab-edit" onclick="setMode('edit')">✏️ Edit</button>
    <button class="mtab"        id="tab-play" onclick="setMode('play')">▶ Play Test</button>
  </div>
  <div class="sep"></div>
  <button class="btn bg bsm" onclick="addSeg()">＋ Segment</button>
  <button class="btn bg bsm" onclick="doImport()">↑ Import CSS</button>
  <div class="sp"></div>
  <button class="btn bg bsm" onclick="copyCSS()">Copy</button>
  <button class="btn bp bsm" onclick="downloadCSS()">↓ Download CSS</button>
</div>

<div class="workspace">

  <!-- Left -->
  <div class="lpanel" id="lpanel">
    <div class="ph">
      <span class="pt">Segments <span id="seg-count" style="color:var(--blueb)">0</span></span>
      <button class="btn bg bsm bicon" onclick="addSeg()">＋</button>
    </div>
    <div class="slist" id="slist"></div>
  </div>

  <!-- Centre -->
  <div class="centre">
    <div class="ctoolbar" id="ctoolbar">
      <span class="clabel" id="clabel">Preview</span>
      <div style="flex:1"></div>
      <div id="edit-tb">
        <span style="font-size:.68rem;color:var(--text3);font-family:var(--mono)">640×360</span>
      </div>
      <div id="play-tb" style="display:none;align-items:center;gap:.6rem;flex:1">
        <div class="phud">
          <span class="pstat">Dist <span id="pd">0</span></span>
          <span class="pstat">Best <span id="pb">—</span></span>
        </div>
        <button class="btn bgreen bsm" id="pstart" onclick="playStart()">▶ Start</button>
        <button class="btn bg bsm" onclick="setMode('edit')">✕ Exit</button>
      </div>
    </div>
    <div class="cwrap" id="cwrap">
      <canvas id="ec" width="640" height="360"></canvas>
      <canvas id="pc" width="640" height="360" style="display:none"></canvas>
      <div id="pdeath">
        <div id="pdeath-d"></div>
        <div id="pdeath-s">Restarting in 1.5s…</div>
      </div>
    </div>
    <p class="hint" id="chint">Click segment to select · Drag to reorder</p>
  </div>

  <!-- Right -->
  <div class="rpanel" id="rpanel">
    <div class="ph"><span class="pt" id="rtitle">Select a segment</span></div>
    <div class="rscroll" id="rscroll">
      <div id="nosel" style="color:var(--text3);font-size:.8rem;padding:.25rem 0">Click a segment to edit.</div>
      <div class="divider"></div>
      <!-- Global settings -->
      <div class="fg">
        <div class="fl">Global Settings</div>
        <div class="gf"><span style="font-size:.68rem;color:var(--text2)">Scroll Speed</span>
          <div class="rrow"><input type="range" id="g-sc" min="1" max="10" step=".5" value="3" oninput="upGlobal()"><span class="rv" id="g-sc-v">3</span></div></div>
        <div class="gf"><span style="font-size:.68rem;color:var(--text2)">Ship Speed</span>
          <div class="rrow"><input type="range" id="g-sh" min="1" max="12" step=".5" value="4" oninput="upGlobal()"><span class="rv" id="g-sh-v">4</span></div></div>
        <div class="gf"><span style="font-size:.68rem;color:var(--text2)">Background</span>
          <div class="frow">
            <input type="color" id="g-bg" value="#020408" oninput="c2t('g-bg','g-bg-t');upGlobal()">
            <input type="text" class="fi" id="g-bg-t" value="#020408" oninput="t2c('g-bg','g-bg-t');upGlobal()">
          </div></div>
        <div class="gf"><span style="font-size:.68rem;color:var(--text2)">Default Wall Color</span>
          <div class="frow">
            <input type="color" id="g-wc" value="#1e3a5f" oninput="c2t('g-wc','g-wc-t');upGlobal()">
            <input type="text" class="fi" id="g-wc-t" value="#1e3a5f" oninput="t2c('g-wc','g-wc-t');upGlobal()">
          </div></div>
      </div>
    </div>
  </div>

</div>

<div class="toast" id="toast"></div>
<input type="file" id="fimport" accept=".css" style="display:none" onchange="handleImport(event)">

<script>
// ════════ STATE ════════
let segs=[], sel=null;
let G={sc:3,sh:4,bg:'#020408',wc:'#1e3a5f'};
let mode='edit';

const DEFAULTS=[
  {w:300,t:.15,b:.85,c:'#1e3a5f'},{w:180,t:.22,b:.85,c:'#1e3a5f'},
  {w:180,t:.22,b:.72,c:'#1e3a5f'},{w:200,t:.10,b:.40,c:'#1e4080'},
  {w:200,t:.60,b:.90,c:'#1e4080'},{w:160,t:.38,b:.62,c:'#1a3a70'},
  {w:250,t:.18,b:.82,c:'#1e3a5f'},{w:150,t:.08,b:.35,c:'#243b80'},
  {w:150,t:.65,b:.92,c:'#243b80'},{w:180,t:.40,b:.60,c:'#2a3f8f'},
  {w:300,t:.20,b:.80,c:'#1e3a5f'},{w:200,t:.30,b:.70,c:'#1e4080'},
];
segs=DEFAULTS.map(s=>({width:s.w,top:s.t,bottom:s.b,color:s.c}));
sel=0;

// ════════ EDIT CANVAS ════════
const ec=document.getElementById('ec'), ectx=ec.getContext('2d');
const EW=ec.width, EH=ec.height;

function drawEdit(){
  ectx.fillStyle=G.bg; ectx.fillRect(0,0,EW,EH);
  const rng=rng32(42); ectx.fillStyle='rgba(180,210,255,0.22)';
  for(let i=0;i<80;i++){const x=rng()*EW,y=rng()*EH,r=rng()*1.2+.3;ectx.beginPath();ectx.arc(x,y,r,0,Math.PI*2);ectx.fill();}
  const total=segs.reduce((a,s)=>a+s.width,0);
  const scale=total>EW?EW/total:1;
  let x=0;
  segs.forEach((s,i)=>{
    const sw=s.width*scale, th=s.top*EH, bh=(1-s.bottom)*EH;
    ectx.fillStyle=sel===i?lighten(s.color,30):s.color;
    ectx.fillRect(x,0,sw,th); ectx.fillRect(x,EH-bh,sw,bh);
    if(sel===i){ectx.strokeStyle='#60a5fa';ectx.lineWidth=2;ectx.strokeRect(x+1,0,sw-2,th);ectx.strokeRect(x+1,EH-bh,sw-2,bh);}
    if(th>10){ectx.fillStyle='rgba(255,255,255,0.18)';ectx.font="9px 'Space Mono',monospace";ectx.textAlign='center';ectx.fillText(i+1,x+sw/2,th/2+4);ectx.textAlign='left';}
    x+=sw;
  });
  // ship marker
  ectx.save();ectx.translate(80,EH/2);ectx.shadowColor='#60a5fa';ectx.shadowBlur=14;
  ectx.beginPath();ectx.moveTo(14,0);ectx.lineTo(-14,-8);ectx.lineTo(-7,0);ectx.lineTo(-14,8);ectx.closePath();
  const g=ectx.createLinearGradient(-14,0,14,0);g.addColorStop(0,'#1d4ed8');g.addColorStop(1,'#93c5fd');
  ectx.fillStyle=g;ectx.fill();ectx.shadowBlur=0;ectx.restore();
}

ec.addEventListener('click',e=>{
  if(mode!=='edit')return;
  const r=ec.getBoundingClientRect(), mx=(e.clientX-r.left)*(EW/r.width);
  const total=segs.reduce((a,s)=>a+s.width,0), scale=total>EW?EW/total:1;
  let x=0;
  for(let i=0;i<segs.length;i++){const sw=segs[i].width*scale;if(mx>=x&&mx<x+sw){pick(i);return;}x+=sw;}
});

// ════════ SEG LIST ════════
function renderList(){
  document.getElementById('seg-count').textContent=segs.length;
  const list=document.getElementById('slist'); list.innerHTML='';
  segs.forEach((s,i)=>{
    const el=document.createElement('div');
    el.className='sitem'+(sel===i?' active':'');
    el.draggable=true; el.dataset.i=i;
    el.innerHTML=`
      <span class="snum">${i+1}</span>
      <div class="sprev">
        <div class="sprev-wall" style="top:0;height:${(s.top*100).toFixed(0)}%;background:${s.color}"></div>
        <div class="sprev-wall" style="bottom:0;height:${((1-s.bottom)*100).toFixed(0)}%;background:${s.color}"></div>
      </div>
      <span class="swbadge">${s.width}</span>
      <button class="btn bdanger bsm bicon" onclick="delSeg(${i});event.stopPropagation()">✕</button>`;
    el.addEventListener('click',()=>pick(i));
    el.addEventListener('dragstart',e=>{e.dataTransfer.setData('text/plain',i);el.classList.add('dragging');});
    el.addEventListener('dragend',()=>el.classList.remove('dragging'));
    el.addEventListener('dragover',e=>{e.preventDefault();el.classList.add('drag-over');});
    el.addEventListener('dragleave',()=>el.classList.remove('drag-over'));
    el.addEventListener('drop',e=>{
      e.preventDefault();el.classList.remove('drag-over');
      const from=parseInt(e.dataTransfer.getData('text/plain')),to=i;
      if(from===to)return;
      const m=segs.splice(from,1)[0];segs.splice(to,0,m);
      if(sel===from)sel=to;else if(sel>from&&sel<=to)sel--;else if(sel<from&&sel>=to)sel++;
      renderAll();
    });
    list.appendChild(el);
  });
}

function pick(i){sel=i;renderList();renderEditor();drawEdit();}

// ════════ EDITOR PANEL ════════
function renderEditor(){
  const nosel=document.getElementById('nosel');
  document.getElementById('rtitle').textContent=sel===null||!segs[sel]?'Select a segment':`Segment ${sel+1}`;
  if(sel===null||!segs[sel]){nosel.style.display='';const o=document.getElementById('segedit');if(o)o.remove();return;}
  nosel.style.display='none';
  const s=segs[sel], gap=(s.bottom-s.top).toFixed(2);
  let ed=document.getElementById('segedit');
  if(!ed){ed=document.createElement('div');ed.id='segedit';ed.style.cssText='display:flex;flex-direction:column;gap:1rem;';
    document.querySelector('.divider').before(ed);}
  ed.innerHTML=`
    <div class="fg"><div class="fl">Width (px)</div>
      <div class="rrow"><input type="range" id="e-w" min="40" max="600" step="10" value="${s.width}" oninput="upSeg()"><span class="rv" id="e-wv">${s.width}</span></div></div>
    <div class="fg"><div class="fl">Top Wall (${(s.top*100).toFixed(0)}%)</div>
      <div class="rrow"><input type="range" id="e-t" min="0" max=".88" step=".01" value="${s.top}" oninput="upSeg()"><span class="rv" id="e-tv">${(s.top*100).toFixed(0)}%</span></div></div>
    <div class="fg"><div class="fl">Bottom Wall (${(s.bottom*100).toFixed(0)}%)</div>
      <div class="rrow"><input type="range" id="e-b" min=".12" max="1" step=".01" value="${s.bottom}" oninput="upSeg()"><span class="rv" id="e-bv">${(s.bottom*100).toFixed(0)}%</span></div></div>
    <div style="background:var(--panel2);border:1px solid var(--border);border-radius:var(--rs);padding:.45rem .65rem">
      <div style="display:flex;justify-content:space-between">
        <span style="font-size:.68rem;color:var(--text2)">Gap</span>
        <span id="e-gv" style="font-family:var(--mono);font-size:.72rem;color:${gap<.15?'var(--red)':'var(--green)'}">${(gap*100).toFixed(0)}%</span>
      </div>
      <div style="margin-top:.3rem;height:4px;background:var(--border);border-radius:2px;overflow:hidden">
        <div id="e-gb" style="height:100%;width:${gap*100}%;background:${gap<.15?'var(--red)':'var(--green)'};border-radius:2px;transition:width .1s"></div>
      </div></div>
    <div class="fg"><div class="fl">Wall Color</div>
      <div class="frow">
        <input type="color" id="e-c" value="${s.color}" oninput="c2t('e-c','e-ct');upSeg()">
        <input type="text" class="fi" id="e-ct" value="${s.color}" oninput="t2c('e-c','e-ct');upSeg()">
      </div></div>
    <div style="display:flex;gap:.4rem">
      <button class="btn bg bsm" style="flex:1" onclick="dupSeg(${sel})">⧉ Dupe</button>
      <button class="btn bdanger bsm" style="flex:1" onclick="delSeg(${sel})">✕ Delete</button>
    </div>`;
}

function upSeg(){
  if(sel===null)return;
  const s=segs[sel];
  s.width=parseFloat(document.getElementById('e-w').value);
  s.top=parseFloat(document.getElementById('e-t').value);
  s.bottom=Math.max(parseFloat(document.getElementById('e-b').value),s.top+.08);
  s.color=document.getElementById('e-c').value;
  document.getElementById('e-ct').value=s.color;
  document.getElementById('e-wv').textContent=s.width;
  document.getElementById('e-tv').textContent=(s.top*100).toFixed(0)+'%';
  document.getElementById('e-bv').textContent=(s.bottom*100).toFixed(0)+'%';
  const gap=s.bottom-s.top;
  document.getElementById('e-gv').textContent=(gap*100).toFixed(0)+'%';
  document.getElementById('e-gv').style.color=gap<.15?'var(--red)':'var(--green)';
  document.getElementById('e-gb').style.width=(gap*100)+'%';
  document.getElementById('e-gb').style.background=gap<.15?'var(--red)':'var(--green)';
  renderList(); drawEdit();
}

function upGlobal(){
  G.sc=parseFloat(document.getElementById('g-sc').value);
  G.sh=parseFloat(document.getElementById('g-sh').value);
  G.bg=document.getElementById('g-bg').value;
  G.wc=document.getElementById('g-wc').value;
  document.getElementById('g-sc-v').textContent=G.sc;
  document.getElementById('g-sh-v').textContent=G.sh;
  document.getElementById('g-bg-t').value=G.bg;
  document.getElementById('g-wc-t').value=G.wc;
  drawEdit();
}

function c2t(ci,ti){document.getElementById(ti).value=document.getElementById(ci).value;}
function t2c(ci,ti){const h=document.getElementById(ti).value.trim();if(/^#[0-9a-fA-F]{6}$/.test(h))document.getElementById(ci).value=h;}

function addSeg(){
  const tops=[.15,.22,.10,.35,.20,.05,.42,.30],bots=[.85,.72,.40,.80,.65,.32,.58,.70];
  const i=segs.length%tops.length;
  segs.push({width:200,top:tops[i],bottom:bots[i],color:'#1e3a5f'});
  sel=segs.length-1; renderAll();
  setTimeout(()=>{const l=document.getElementById('slist');l.scrollTop=l.scrollHeight;},50);
}
function delSeg(i){segs.splice(i,1);if(sel>=segs.length)sel=segs.length-1;if(!segs.length)sel=null;renderAll();}
function dupSeg(i){segs.splice(i+1,0,{...segs[i]});sel=i+1;renderAll();}

// ════════ PLAY MODE ════════
const pc=document.getElementById('pc'), pctx=pc.getContext('2d');
const PW=pc.width, PH=pc.height;
let pship,ppress=false,paf,prun=false,pdist=0,pangle=0,ptangle=0;
let ptrial=[],ptracc=0,ppulse=0,pwx=0,psq=[],ptimer=null,pbest=0;

const pstars=Array.from({length:120},()=>({
  x:Math.random()*PW,y:Math.random()*PH,r:Math.random()*1.5+.3,
  spd:Math.random()*1.5+.3,op:Math.random()*.6+.2,
}));

function pTickStars(){pstars.forEach(s=>{s.x-=s.spd*(G.sc/4);if(s.x<0){s.x=PW;s.y=Math.random()*PH;}});}
function pDrawStars(){pstars.forEach(s=>{pctx.beginPath();pctx.arc(s.x,s.y,s.r,0,Math.PI*2);pctx.fillStyle=`rgba(200,220,255,${s.op})`;pctx.fill();});}

function pDrawShip(x,y,a){
  pctx.save();pctx.translate(x,y);pctx.rotate(a);
  pctx.shadowColor='#60a5fa';pctx.shadowBlur=18;
  pctx.beginPath();pctx.moveTo(14,0);pctx.lineTo(-14,-8);pctx.lineTo(-7,0);pctx.lineTo(-14,8);pctx.closePath();
  const g=pctx.createLinearGradient(-14,0,14,0);g.addColorStop(0,'#1d4ed8');g.addColorStop(1,'#93c5fd');
  pctx.fillStyle=g;pctx.fill();
  pctx.shadowColor='#f59e0b';pctx.shadowBlur=12;pctx.fillStyle='#fbbf24';
  pctx.beginPath();pctx.ellipse(-9,0,5,3,0,0,Math.PI*2);pctx.fill();
  pctx.shadowBlur=0;pctx.restore();
}

function pTickTrail(x,y){
  ptracc+=G.sc;
  if(ptracc>=3){ptracc=0;ptrial.push({x,y});if(ptrial.length>48)ptrial.shift();}
  for(let i=0;i<ptrial.length-1;i++)ptrial[i].x-=G.sc;
}
function pDrawTrail(){
  if(ptrial.length<2)return;
  ppulse+=.07;const p=.55+.45*(.5+.5*Math.sin(ppulse));
  for(let i=1;i<ptrial.length;i++){
    const t=i/ptrial.length;
    pctx.beginPath();pctx.moveTo(ptrial[i-1].x,ptrial[i-1].y);pctx.lineTo(ptrial[i].x,ptrial[i].y);
    pctx.lineWidth=1+t*5;pctx.lineCap='round';
    pctx.strokeStyle=`rgba(96,165,250,${t*p})`;
    pctx.shadowColor=t>.7?'#93c5fd':'transparent';pctx.shadowBlur=t>.7?8:0;pctx.stroke();
  }
  pctx.shadowBlur=0;
}

function pBuildQ(){
  let re=psq.length>0?psq[psq.length-1].startX+psq[psq.length-1].width:0;
  let c=psq.length===0?0:(psq[psq.length-1].si+1)%segs.length;
  while(re<pwx+PW+400){
    const s=segs[c%segs.length];
    psq.push({si:c%segs.length,startX:re,width:s.width,top:s.top,bottom:s.bottom,color:s.color});
    re+=s.width;c++;
  }
}
function pTickQ(){pwx+=G.sc;while(psq.length>0&&psq[0].startX+psq[0].width<pwx)psq.shift();pBuildQ();}
function pDrawSegs(){
  psq.forEach(s=>{
    const sx=s.startX-pwx,th=s.top*PH,bh=(1-s.bottom)*PH;
    pctx.fillStyle=s.color;pctx.fillRect(sx,0,s.width,th);pctx.fillRect(sx,PH-bh,s.width,bh);
    for(const ey of[th,PH-bh]){
      const eg=pctx.createLinearGradient(0,ey-6,0,ey+6);
      eg.addColorStop(0,'rgba(96,165,250,0)');eg.addColorStop(.5,'rgba(96,165,250,0.18)');eg.addColorStop(1,'rgba(96,165,250,0)');
      pctx.fillStyle=eg;pctx.fillRect(sx,ey-6,s.width,12);
    }
  });
}
function pCollide(){
  const s=psq.find(s=>{const x=s.startX-pwx;return pship.x+14>x&&pship.x-14<x+s.width;});
  if(!s)return false;
  return pship.y-8<s.top*PH||pship.y+8>s.bottom*PH;
}

function playStart(){
  if(ptimer){clearTimeout(ptimer);ptimer=null;}
  cancelAnimationFrame(paf);
  pship={x:100,y:PH/2};ptrial=[];ptracc=0;pangle=0;ptangle=0;
  pwx=0;psq=[];pdist=0;prun=true;ppress=false;
  pBuildQ();
  document.getElementById('pdeath').classList.remove('show');
  document.getElementById('pd').textContent='0';
  document.getElementById('pstart').textContent='↺ Restart';
  pLoop();
}

function pLoop(){if(!prun)return;pTick();pDraw();paf=requestAnimationFrame(pLoop);}

function pTick(){
  if(ppress){pship.y-=G.sh;ptangle=-.45;}else{pship.y+=G.sh;ptangle=.45;}
  pangle+=(ptangle-pangle)*.15;
  pship.y=Math.max(8,Math.min(PH-8,pship.y));
  pTickTrail(pship.x,pship.y);pTickQ();pTickStars();
  pdist+=G.sc;
  const d=Math.floor(pdist/10);
  document.getElementById('pd').textContent=d;
  if(pCollide()){
    prun=false;cancelAnimationFrame(paf);pDraw();
    if(d>pbest){pbest=d;document.getElementById('pb').textContent=pbest;}
    document.getElementById('pdeath-d').textContent='💥 '+d+' km';
    document.getElementById('pdeath-s').textContent='Restarting in 1.5s…';
    document.getElementById('pdeath').classList.add('show');
    ptimer=setTimeout(()=>{document.getElementById('pdeath').classList.remove('show');playStart();},1500);
  }
}

function pDraw(){
  pctx.fillStyle=G.bg;pctx.fillRect(0,0,PW,PH);
  const nb=pctx.createRadialGradient(PW*.6,PH*.4,0,PW*.6,PH*.4,PW*.55);
  nb.addColorStop(0,'rgba(30,58,138,0.12)');nb.addColorStop(1,'transparent');
  pctx.fillStyle=nb;pctx.fillRect(0,0,PW,PH);
  pDrawStars();pDrawSegs();pDrawTrail();pDrawShip(pship.x,pship.y,pangle);
}

// ════════ MODE SWITCHING ════════
function setMode(m){
  mode=m;
  const ep=m==='edit';
  document.getElementById('tab-edit').classList.toggle('active',ep);
  document.getElementById('tab-play').classList.toggle('active',!ep);
  document.getElementById('lpanel').style.display=ep?'flex':'none';
  document.getElementById('rpanel').style.display=ep?'flex':'none';
  document.getElementById('edit-tb').style.display=ep?'flex':'none';
  document.getElementById('play-tb').style.display=ep?'none':'flex';
  ec.style.display=ep?'block':'none';
  pc.style.display=ep?'none':'block';
  document.getElementById('chint').textContent=ep
    ?'Click segment to select · Drag to reorder'
    :'Hold Space / ↑ / tap to go up — release to drop';

  if(!ep){
    cancelAnimationFrame(paf);
    if(ptimer){clearTimeout(ptimer);ptimer=null;}
    prun=false;
    document.getElementById('pdeath').classList.remove('show');
    document.getElementById('pstart').textContent='▶ Start';
    document.getElementById('pd').textContent='0';
    pctx.fillStyle=G.bg;pctx.fillRect(0,0,PW,PH);
    pDrawStars();pDrawShip(100,PH/2,0);
    pctx.fillStyle='rgba(200,220,255,0.3)';
    pctx.font="500 0.9rem 'Space Grotesk',sans-serif";pctx.textAlign='center';
    pctx.fillText('Press Start to play test',PW/2,PH/2);pctx.textAlign='left';
  } else {
    cancelAnimationFrame(paf);
    if(ptimer){clearTimeout(ptimer);ptimer=null;}
    prun=false; renderAll();
  }
}

// play controls
document.addEventListener('keydown',e=>{if(mode==='play'&&(e.key===' '||e.key==='ArrowUp')){e.preventDefault();ppress=true;}});
document.addEventListener('keyup',  e=>{if(e.key===' '||e.key==='ArrowUp')ppress=false;});
pc.addEventListener('mousedown', ()=>ppress=true);
pc.addEventListener('mouseup',   ()=>ppress=false);
pc.addEventListener('mouseleave',()=>ppress=false);
pc.addEventListener('touchstart',e=>{e.preventDefault();ppress=true;},{passive:false});
pc.addEventListener('touchend',  e=>{e.preventDefault();ppress=false;},{passive:false});

// ════════ CSS I/O ════════
function genCSS(){
  return[
    `/* Space Waves — Level\n * ${new Date().toLocaleString()} */`,
    `\n:root {`,
    `  --level-scroll-speed: ${G.sc};`,
    `  --level-gap-min:      0.12;`,
    `  --wall-default-color: ${G.wc};`,
    `  --bg-color:           ${G.bg};`,
    `  --ship-speed:         ${G.sh};`,
    `  --level-segment-count: ${segs.length};`,
    ``,
    ...segs.flatMap((s,i)=>{const n=i+1;return[
      `  /* ${n} */`,
      `  --seg-${n}-width:  ${s.width};`,
      `  --seg-${n}-top:    ${s.top.toFixed(2)};`,
      `  --seg-${n}-bottom: ${s.bottom.toFixed(2)};`,
      `  --seg-${n}-color:  ${s.color};`,
    ];}),
    `}`
  ].join('\n');
}

function downloadCSS(){
  const b=new Blob([genCSS()],{type:'text/css'});
  const u=URL.createObjectURL(b);
  const a=document.createElement('a');a.href=u;a.download='space-waves-level.css';a.click();URL.revokeObjectURL(u);
  toast('Downloaded!');
}
function copyCSS(){navigator.clipboard.writeText(genCSS()).then(()=>toast('Copied!'));}
function doImport(){document.getElementById('fimport').click();}
function handleImport(e){
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=ev=>{try{parseCSS(ev.target.result);toast('Imported!');}catch(err){alert('Error: '+err.message);}};
  r.readAsText(f);e.target.value='';
}
function parseCSS(css){
  const gv=n=>{const m=css.match(new RegExp(`--${n}\\s*:\\s*([^;]+);`));return m?m[1].trim():null;};
  const sc=gv('level-scroll-speed'),sh=gv('ship-speed'),bg=gv('bg-color'),wc=gv('wall-default-color'),ct=gv('level-segment-count');
  if(sc)G.sc=parseFloat(sc); if(sh)G.sh=parseFloat(sh); if(bg)G.bg=bg; if(wc)G.wc=wc;
  document.getElementById('g-sc').value=G.sc; document.getElementById('g-sh').value=G.sh;
  document.getElementById('g-bg').value=G.bg; document.getElementById('g-wc').value=G.wc;
  document.getElementById('g-sc-v').textContent=G.sc; document.getElementById('g-sh-v').textContent=G.sh;
  document.getElementById('g-bg-t').value=G.bg; document.getElementById('g-wc-t').value=G.wc;
  const n=parseInt(ct)||0;
  if(n>0){
    segs=[];
    for(let i=1;i<=n;i++){
      const w=gv(`seg-${i}-width`),t=gv(`seg-${i}-top`),b=gv(`seg-${i}-bottom`),c=gv(`seg-${i}-color`);
      if(w&&t&&b)segs.push({width:parseFloat(w),top:parseFloat(t),bottom:parseFloat(b),color:c||G.wc});
    }
    sel=segs.length>0?0:null;
  }
  renderAll();
}

// ════════ HELPERS ════════
function renderAll(){renderList();renderEditor();drawEdit();}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200);}
function rng32(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function lighten(hex,amt){let r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);return'#'+[Math.min(255,r+amt),Math.min(255,g+amt),Math.min(255,b+amt)].map(v=>v.toString(16).padStart(2,'0')).join('');}

renderAll();
</script>
