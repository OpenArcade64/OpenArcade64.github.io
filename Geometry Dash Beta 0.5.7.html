<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geometry Dash Engine - Full GD Editor & Speed Engine</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        body {
            margin: 0; display: flex; justify-content: center; align-items: center;
            height: 100vh; width: 100vw; background-color: #1a1a2e; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: white; overflow: hidden; user-select: none;
        }
        #game-container { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; }
        canvas { background-color: #16213e; display: block; width: 100%; height: 100%; }
        
        .ui-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            background: rgba(22, 33, 62, 0.85); display: none; z-index: 20;
        }
        #pause-ui { background: rgba(22, 33, 62, 0.4); justify-content: flex-start; padding-top: 20px; }
        
        .controls-row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
        .btn {
            background-color: #e94560; color: white; border: none; padding: 10px 25px; margin: 5px;
            font-size: 18px; font-weight: bold; cursor: pointer; border-radius: 5px; transition: transform 0.1s;
        }
        .btn:hover { transform: scale(1.05); }
        
        #editor-ui {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; display: none; flex-direction: column; justify-content: space-between;
            z-index: 10;
        }
        .editor-top-bar {
            background: rgba(15, 52, 96, 0.95); padding: 6px 10px; display: flex;
            justify-content: space-between; align-items: center; pointer-events: auto; gap: 8px; flex-wrap: wrap;
        }
        
        .editor-bottom-bar {
            background: rgba(15, 52, 96, 0.95); padding: 8px 10px; display: flex;
            flex-direction: row; align-items: center; pointer-events: auto; gap: 12px;
            min-height: 110px;
        }

        .mode-tabs-stacked { display: flex; flex-direction: column; gap: 5px; flex-shrink: 0; }
        .mode-btn {
            padding: 6px 16px; font-weight: 900; font-size: 13px; border-radius: 6px;
            border: 2px solid #ffffff; cursor: pointer; text-transform: uppercase;
            letter-spacing: 1px; transition: transform 0.1s, box-shadow 0.2s; text-align: center;
        }
        .mode-btn:hover { transform: scale(1.05); }
        .mode-btn.build { background-color: #00b4d8; color: white; }
        .mode-btn.edit { background-color: #70e000; color: #1a1a2e; }
        .mode-btn.delete { background-color: #e94560; color: white; }
        .mode-btn.active { box-shadow: 0 0 12px #ffff00; border-color: #ffff00; }

        .editor-side-bar {
            position: absolute; left: 12px; top: 50px; display: flex; flex-direction: column; gap: 10px;
            pointer-events: auto; z-index: 15;
        }
        
        .icon-btn {
            width: 44px; height: 44px; border-radius: 50%; border: 3px solid #ffffff;
            display: flex; justify-content: center; align-items: center; cursor: pointer;
            font-weight: bold; font-size: 18px; box-shadow: 0 4px 8px rgba(0,0,0,0.5);
            transition: transform 0.1s, background-color 0.2s; position: relative;
        }
        .icon-btn:hover { transform: scale(1.1); }
        .btn-playtest { background-color: #8ac926; color: #16213e; }
        .btn-pause-pt { background-color: #ffca3a; color: #16213e; display: none; }
        .btn-stop-pt { background-color: #ff595e; color: #ffffff; display: none; }
        .btn-zoom { background-color: #70e000; color: #16213e; }

        .mode-panel { display: none; flex-direction: column; align-items: center; width: 100%; flex-grow: 1; }
        .mode-panel.active { display: flex; }

        .category-tabs { display: flex; gap: 6px; margin-bottom: 6px; align-items: center; flex-wrap: wrap; }
        .cat-tab-btn {
            background-color: #16213e; border: 1px solid #4a4e69; color: #a2a2d0;
            padding: 4px 12px; font-size: 12px; font-weight: bold; cursor: pointer; border-radius: 4px;
        }
        .cat-tab-btn.active { background-color: #e94560; color: white; border-color: #e94560; }
        
        .object-group { display: none; gap: 6px; flex-wrap: wrap; justify-content: center; align-items: center; }
        .object-group.active { display: flex; }

        .editor-btn {
            background-color: #16213e; border: 2px solid #e94560; color: white;
            padding: 4px 8px; font-weight: bold; cursor: pointer; border-radius: 4px; font-size: 12px;
            display: inline-flex; align-items: center; justify-content: center;
        }
        .editor-btn.active { background-color: #e94560; }

        .edit-controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: center; }
        .d-pad { display: grid; grid-template-columns: repeat(3, 26px); gap: 2px; align-items: center; }
        .d-pad-btn {
            background-color: #16213e; border: 1px solid #70e000; color: white; font-weight: bold;
            height: 24px; cursor: pointer; border-radius: 3px; display: flex; justify-content: center; align-items: center;
        }
        .d-pad-btn:hover { background-color: #70e000; color: #1a1a2e; }

        .settings-container { margin-top: 20px; background: rgba(0,0,0,0.3); padding: 10px 20px; border-radius: 8px; }
        .color-picker-container { display: flex; gap: 5px; align-items: center; font-size: 12px; }
        .audio-controls-container { display: flex; gap: 6px; align-items: center; font-size: 12px; }
        input[type="color"] { cursor: pointer; background: none; border: 1px solid #fff; border-radius: 3px; height: 22px; width: 26px; padding: 0;}
        
        /* Modal for saving/loading level text */
        .modal-bg {
            display: none; position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.8); z-index: 100; justify-content: center; align-items: center;
        }
        .modal-content {
            background: rgba(15, 52, 96, 0.95); padding: 20px; border-radius: 8px; 
            width: 500px; max-width: 90%; display: flex; flex-direction: column; gap: 10px; border: 2px solid #e94560;
        }
        textarea.save-area {
            width: 100%; height: 200px; background: #16213e; color: #fff; border: 1px solid #4a4e69; 
            padding: 10px; font-family: monospace; resize: none; box-sizing: border-box; outline: none;
        }
    </style>
</head>
<body>

    <input type="file" id="zipFileInput" accept=".zip" style="display:none;" onchange="handleZipUpload(event)">
    <input type="file" id="audioInput" accept="audio/*" style="display:none;" onchange="handleAudioUpload(event)">

    <div id="game-container">
        <canvas id="gameCanvas"></canvas>
        
        <div id="menu-ui" class="ui-layer" style="display: flex;">
            <h1 style="font-size: 56px; color: #e94560; text-shadow: 2px 2px 0px #0f3460; margin-bottom: 20px;">GD Engine</h1>
            <div class="controls-row">
                <button class="btn" onclick="startGame()">Play</button>
                <button class="btn" onclick="openEditor()" style="background-color: #4a4e69;">Editor</button>
            </div>
            <div class="settings-container">
                <label style="font-size: 18px; cursor: pointer;">
                    <input type="checkbox" id="hitboxToggle" onchange="toggleHitboxes()"> Show Hitboxes
                </label>
            </div>
        </div>

        <div id="pause-ui" class="ui-layer">
            <h1 style="font-size: 36px; color: #fff; margin-bottom: 10px;">PAUSED</h1>
            <p style="margin-top: 0; color: #a2a2d0;">Hold <b>Space</b> and press <b>F</b> to frame-step.</p>
            <div class="controls-row">
                <button class="btn" onclick="resumeGame()">Resume</button>
                <button class="btn" onclick="restartLevel()" style="background-color: #2196F3;">Restart</button>
                <button class="btn" onclick="stepFrame()" style="background-color: #fca311;">Step Frame (F)</button>
                <button class="btn" onclick="returnToMenu()" style="background-color: #555;">Quit</button>
            </div>
        </div>

        <div id="save-modal" class="modal-bg">
            <div class="modal-content">
                <h2 id="save-title" style="margin:0; font-size: 24px; color:#e94560;">Save/Load Level</h2>
                <p id="save-desc" style="margin:0; font-size: 14px; color:#a2a2d0;"></p>
                <textarea id="save-textarea" class="save-area"></textarea>
                <div style="display:flex; justify-content:space-between; margin-top: 10px;">
                    <button class="btn" style="background-color: #555;" onclick="document.getElementById('save-modal').style.display='none'">Cancel</button>
                    <button class="btn" id="save-action-btn">Action</button>
                </div>
            </div>
        </div>

        <div id="editor-ui">
            <div class="editor-side-bar">
                <div class="icon-btn btn-playtest" id="icon-playtest" title="Playtest" onclick="handlePlaytestClick()">▶</div>
                <div class="icon-btn btn-pause-pt" id="icon-pause-pt" title="Pause Playtest" onclick="pausePlaytest()">❚❚</div>
                <div class="icon-btn btn-stop-pt" id="icon-stop-pt" title="Stop Playtest" onclick="stopPlaytest()">✖</div>
                <div class="icon-btn btn-zoom" id="btn-zoom-in" title="Zoom In" onclick="changeZoom(0.15)">🔍+</div>
                <div class="icon-btn btn-zoom" id="btn-zoom-out" title="Zoom Out" onclick="changeZoom(-0.15)">🔍-</div>
            </div>

            <div class="editor-top-bar" id="editor-top-bar">
                <button class="editor-btn" onclick="returnToMenu()">Exit</button>
                
                <div class="audio-controls-container">
                    <button class="editor-btn" onclick="document.getElementById('audioInput').click()" style="background-color: #e67e22; border-color: #e67e22;">🎵 Load MP3</button>
                    <label for="musicOffset">Start (s):</label>
                    <input type="number" id="musicOffset" value="0" step="0.1" min="0" style="width: 45px; background: #16213e; color: white; border: 1px solid #fff; border-radius: 3px; padding: 2px;" onchange="updateMusicOffset()">
                    <span id="audio-filename" style="max-width: 80px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #a2a2d0;">No Music</span>
                </div>

                <button class="editor-btn" onclick="saveLevelZip()" style="background-color: #8e44ad; border-color: #8e44ad;">📦 Save ZIP</button>
                <button class="editor-btn" onclick="document.getElementById('zipFileInput').click()" style="background-color: #27ae60; border-color: #27ae60;">📁 Load ZIP</button>
                <button class="editor-btn" onclick="startGame()" style="background-color: #2196F3; border-color: #2196F3;">Full Play</button>
                <button class="editor-btn" onclick="clearLevel()" style="background-color: #e94560; border-color: #e94560;">Clear All</button>
                
                <div class="color-picker-container">
                    <label for="bgColor">BG:</label>
                    <input type="color" id="bgColor" value="#16213e" onchange="updateColors()">
                    <label for="groundColor">Ground:</label>
                    <input type="color" id="groundColor" value="#0f3460" onchange="updateColors()">
                </div>
            </div>

            <div class="editor-bottom-bar" id="editor-bottom-bar">
                <div class="mode-tabs-stacked">
                    <button class="mode-btn build active" id="tab-mode-build" onclick="switchMode('BUILD')">BUILD</button>
                    <button class="mode-btn edit" id="tab-mode-edit" onclick="switchMode('EDIT')">EDIT</button>
                    <button class="mode-btn delete" id="tab-mode-delete" onclick="switchMode('DELETE')">DELETE</button>
                </div>

                <div class="mode-panel active" id="panel-build">
                    <div class="category-tabs">
                        <button class="cat-tab-btn active" id="tab-blocks" onclick="switchCategory('blocks')">Blocks & Slopes</button>
                        <button class="cat-tab-btn" id="tab-hazards" onclick="switchCategory('hazards')">Hazards</button>
                        <button class="cat-tab-btn" id="tab-interactables" onclick="switchCategory('interactables')">Pads, Orbs & Portals</button>

                        <button class="editor-btn" onclick="rotateBuildObject()" style="border-color:#00b4d8; background-color:#00b4d8; margin-left: 10px;">Rotate (R)</button>
                        <button class="editor-btn" onclick="flipXBuildObject()" style="border-color:#00b4d8; background-color:#00b4d8;">Flip X (X)</button>
                        <button class="editor-btn" onclick="flipYBuildObject()" style="border-color:#00b4d8; background-color:#00b4d8;">Flip Y (Y)</button>
                    </div>

                    <div class="object-group active" id="group-blocks">
                        <button class="editor-btn active" id="btn-block" onclick="selectObj('block')">Block</button>
                        <button class="editor-btn" id="btn-slope-1x1" onclick="selectObj('slope-1x1')">Slope 1x1 (45°)</button>
                        <button class="editor-btn" id="btn-slope-1x2" onclick="selectObj('slope-1x2')">Slope 1x2 (Grad 2)</button>
                    </div>

                    <div class="object-group" id="group-hazards">
                        <button class="editor-btn" id="btn-spike" onclick="selectObj('spike')">Spike</button>
                    </div>

                    <div class="object-group" id="group-interactables">
                        <button class="editor-btn" id="btn-pad" onclick="selectObj('pad')">Pad (Y)</button>
                        <button class="editor-btn" id="btn-blue-pad" onclick="selectObj('blue-pad')" style="border-color:#00ffff;">Pad (B)</button>
                        <button class="editor-btn" id="btn-orb" onclick="selectObj('orb')">Orb (Y)</button>
                        <button class="editor-btn" id="btn-green-orb" onclick="selectObj('green-orb')" style="border-color:#00ff00;">Orb (G)</button>
                        <button class="editor-btn" id="btn-blue-orb" onclick="selectObj('blue-orb')" style="border-color:#00ffff;">Orb (B)</button>
                        <button class="editor-btn" id="btn-portal-blue" onclick="selectObj('portal-blue')" style="border-color:#0088ff;">Portal (Nrm)</button>
                        <button class="editor-btn" id="btn-portal-yellow" onclick="selectObj('portal-yellow')" style="border-color:#ffaa00;">Portal (Flp)</button>

                        <button class="editor-btn" id="btn-speed-0.5x" onclick="selectObj('speed-0.5x')" style="border-color:#ffaa00;">0.5x</button>
                        <button class="editor-btn" id="btn-speed-1x" onclick="selectObj('speed-1x')" style="border-color:#0088ff;">1x</button>
                        <button class="editor-btn" id="btn-speed-2x" onclick="selectObj('speed-2x')" style="border-color:#00ff00;">2x</button>
                        <button class="editor-btn" id="btn-speed-3x" onclick="selectObj('speed-3x')" style="border-color:#ff00ff;">3x</button>
                        <button class="editor-btn" id="btn-speed-4x" onclick="selectObj('speed-4x')" style="border-color:#ff0044;">4x</button>
                    </div>
                </div>

                <div class="mode-panel" id="panel-edit">
                    <div class="edit-controls">
                        <div class="d-pad">
                            <div></div>
                            <button class="d-pad-btn" onclick="moveSelected(0, -30)">▲</button>
                            <div></div>
                            <button class="d-pad-btn" onclick="moveSelected(-30, 0)">◄</button>
                            <div style="font-size:10px; text-align:center; color:#70e000;">MOVE</div>
                            <button class="d-pad-btn" onclick="moveSelected(30, 0)">►</button>
                            <div></div>
                            <button class="d-pad-btn" onclick="moveSelected(0, 30)">▼</button>
                            <div></div>
                        </div>
                        <button class="editor-btn" onclick="rotateSelected()" style="border-color:#70e000;">Rotate (R)</button>
                        <button class="editor-btn" onclick="flipXSelected()" style="border-color:#70e000;">Flip X (X)</button>
                        <button class="editor-btn" onclick="flipYSelected()" style="border-color:#70e000;">Flip Y (Y)</button>
                        <button class="editor-btn" onclick="duplicateSelected()" style="border-color:#70e000;">Duplicate</button>
                        <button class="editor-btn" onclick="deselectAll()" style="border-color:#aaa;">Deselect All</button>
                        <button class="editor-btn" onclick="deleteSelected()" style="border-color:#e94560;">Delete Selected</button>
                    </div>
                </div>

                <div class="mode-panel" id="panel-delete">
                    <span style="color:#e94560; font-weight:bold; font-size:13px;">Click or drag over objects to delete them.</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const menuUI = document.getElementById('menu-ui');
        const pauseUI = document.getElementById('pause-ui');
        const editorUI = document.getElementById('editor-ui');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        let state = 'MENU'; 
        const gridSize = 30;
        const groundY = 360; 
        
        let scrollX = 0;
        let gameScrollY = 0; 
        let showHitboxes = false;

        // Split Zoom Levels
        let editorZoomLevel = 1.6; 
        let playZoomLevel = 1.6; 

        let activeMode = 'BUILD'; 

        const SPEEDS = {
            '0.5x': 4.185,
            '1x':   5.190,
            '2x':   6.450,
            '3x':   7.795,
            '4x':   9.590
        };
        let currentGameSpeed = SPEEDS['1x'];

        let currentBgColor = '#16213e';
        let currentGroundColor = '#0f3460';
        let groundLineColor = '#ffffff';

        // --- Audio Management ---
        let bgAudio = new Audio();
        let musicOffset = 0;
        let isAudioLoaded = false;
        let currentSongFile = null;

        function handleAudioUpload(event) {
            const file = event.target.files[0];
            if (file) {
                currentSongFile = file;
                const url = URL.createObjectURL(file);
                bgAudio.src = url;
                bgAudio.load();
                isAudioLoaded = true;
                const fileNameSpan = document.getElementById('audio-filename');
                fileNameSpan.innerText = file.name;
                fileNameSpan.title = file.name;
            }
        }

        function updateMusicOffset() {
            let val = parseFloat(document.getElementById('musicOffset').value);
            musicOffset = isNaN(val) ? 0 : Math.max(0, val);
        }

        function playMusic() {
            if (!isAudioLoaded) return;
            let timeInLevel = scrollX / (currentGameSpeed * 60);
            let targetTime = musicOffset + timeInLevel;
            if (targetTime < bgAudio.duration) {
                bgAudio.currentTime = targetTime;
                bgAudio.play().catch(e => console.log("Audio playback error:", e));
            }
        }

        function pauseMusic() {
            if (isAudioLoaded) bgAudio.pause();
        }

        function stopMusic() {
            if (isAudioLoaded) {
                bgAudio.pause();
                bgAudio.currentTime = musicOffset;
            }
        }

        // --- Editor Data ---
        let editorScrollX = 0, editorScrollY = 150; 
        let currentEditorObj = 'block';
        let editorRotation = 0;
        let editorFlipX = false;
        let editorFlipY = false;
        let mouseX = 0, mouseY = 0;

        let selectedObjects = [];
        let isBoxSelecting = false;
        let boxStart = { x: 0, y: 0 };
        let boxCurrent = { x: 0, y: 0 };

        let playerTrail = [];
        let deathMarks = [];
        let clickIndicators = [];
        
        let particles = [];
        let deathStartTime = 0;
        const DEATH_DURATION = 800;

        const gravity = 0.95;
        const maxFallSpeed = 15.0; 
        const jumpStrength = -11.5;    
        const padJumpStrength = -14.5; 

        let player = {
            x: 150, y: groundY - 15, width: 30, height: 30, hitboxW: 10, hitboxH: 10,
            yVelocity: 0, isGrounded: true, isOnSlope: false, rotation: 0, lastY: 0, gravityDir: 1, slopeVelocity: 0,
            upwardFallTimer: 0, padCooldown: 0 
        };

        let isHoldingJump = false;
        let orbClickAvailable = false; 
        let levelData = [];

        function initEditorIcons() {
            const types = ['block', 'slope-1x1', 'slope-1x2', 'spike', 'pad', 'blue-pad', 'orb', 'green-orb', 'blue-orb', 'portal-blue', 'portal-yellow', 'speed-0.5x', 'speed-1x', 'speed-2x', 'speed-3x', 'speed-4x'];
            
            types.forEach(type => {
                let btn = document.getElementById('btn-' + type);
                if(btn) {
                    let tempCanvas = document.createElement('canvas');
                    tempCanvas.width = 20; tempCanvas.height = 20;
                    let tCtx = tempCanvas.getContext('2d');
                    tCtx.translate(10, 10);
                    
                    tCtx.fillStyle = '#0f3460'; tCtx.strokeStyle = '#fff'; tCtx.lineWidth = 1;
                    
                    if (type === 'block') { tCtx.fillRect(-8,-8,16,16); tCtx.strokeRect(-8,-8,16,16); }
                    else if (type.startsWith('slope')) {
                        tCtx.beginPath(); tCtx.moveTo(-8,8); tCtx.lineTo(8,8); 
                        if(type === 'slope-1x1') tCtx.lineTo(8,-8); else tCtx.lineTo(8,-16); 
                        tCtx.closePath(); tCtx.fill(); tCtx.stroke();
                    }
                    else if (type === 'spike') { tCtx.fillStyle='#ffb8b8'; tCtx.beginPath(); tCtx.moveTo(0,-8); tCtx.lineTo(8,8); tCtx.lineTo(-8,8); tCtx.fill(); }
                    else if (type.includes('pad')) { tCtx.fillStyle = type==='pad'?'#ffd700':'#00ffff'; tCtx.fillRect(-8, 3, 16, 5); }
                    else if (type.includes('orb')) {
                        tCtx.fillStyle = type==='orb'?'#ffd700':type==='green-orb'?'#00ff00':'#00ffff';
                        tCtx.beginPath(); tCtx.arc(0,0,6,0,Math.PI*2); tCtx.fill(); tCtx.stroke();
                    }
                    else if (type.includes('portal')) {
                        tCtx.fillStyle = type==='portal-blue'?'#0088ff':'#ffaa00';
                        tCtx.beginPath(); tCtx.ellipse(0,0,5,9,0,0,Math.PI*2); tCtx.fill(); tCtx.stroke();
                    }
                    else if (type.startsWith('speed-')) {
                        let sKey = type.replace('speed-', '');
                        tCtx.fillStyle = sKey==='0.5x'?'#ffaa00':sKey==='1x'?'#0088ff':sKey==='2x'?'#00ff00':sKey==='3x'?'#ff00ff':'#ff0044';
                        tCtx.fillRect(-7,-7,14,14); tCtx.strokeRect(-7,-7,14,14);
                        tCtx.fillStyle='#fff'; tCtx.font='bold 8px sans-serif'; tCtx.textAlign='center'; tCtx.textBaseline='middle';
                        tCtx.fillText(sKey.replace('x',''), 0, 0); 
                    }

                    let img = document.createElement('img');
                    img.src = tempCanvas.toDataURL();
                    img.style.verticalAlign = 'middle';
                    img.style.marginRight = '6px';
                    
                    let text = btn.innerText;
                    btn.innerHTML = '';
                    btn.appendChild(img);
                    btn.appendChild(document.createTextNode(text));
                }
            });
        }

        function switchMode(mode) {
            activeMode = mode;
            document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.mode-panel').forEach(p => p.classList.remove('active'));

            document.getElementById('tab-mode-' + mode.toLowerCase()).classList.add('active');
            document.getElementById('panel-' + mode.toLowerCase()).classList.add('active');

            if (mode !== 'EDIT') deselectAll();
        }

        function switchCategory(catName) {
            document.querySelectorAll('.cat-tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.object-group').forEach(g => g.classList.remove('active'));

            document.getElementById('tab-' + catName).classList.add('active');
            document.getElementById('group-' + catName).classList.add('active');
        }

        function changeZoom(delta) {
            editorZoomLevel = Math.min(3.0, Math.max(0.5, editorZoomLevel + delta));
        }

        function handlePlaytestClick() {
            if (state === 'EDITOR') startPlaytest();
            else if (state === 'EDITOR_PLAY_PAUSED') resumePlaytest();
        }

        function setPlaytestUIVisibility(isPlaytesting) {
            const topBar = document.getElementById('editor-top-bar');
            const bottomBar = document.getElementById('editor-bottom-bar');
            const playBtn = document.getElementById('icon-playtest');

        }

        function startPlaytest() {
            state = 'EDITOR_PLAY';
            pauseUI.style.display = 'none'; 
            playerTrail = []; clickIndicators = [];
            setPlaytestUIVisibility(true);
            document.getElementById('icon-pause-pt').style.display = 'flex';
            document.getElementById('icon-stop-pt').style.display = 'flex';
            resetPlayer();
            stopMusic();
            playMusic();
        }

        function pausePlaytest() {
            if (state === 'EDITOR_PLAY') {
                state = 'EDITOR_PLAY_PAUSED';
                document.getElementById('icon-pause-pt').style.display = 'none';
                setPlaytestUIVisibility(false);
                pauseMusic();
            }
        }

        function resumePlaytest() {

                state = 'EDITOR_PLAY';

                document.getElementById('icon-pause-pt').style.display = 'flex';

            document.getElementById('icon-stop-pt').style.display = 'none';

        function registerJumpInput() {
            if (!isHoldingJump) {
                orbClickAvailable = true;
                if (state === 'PLAY' || state === 'EDITOR_PLAY') {
                    clickIndicators.push({ x: player.x + scrollX, y: player.y });
                }
            }
            isHoldingJump = true;
        }

        function rotateBuildObject() { editorRotation = (editorRotation + 90) % 360; }
        function flipXBuildObject() { editorFlipX = !editorFlipX; }
        function flipYBuildObject() { editorFlipY = !editorFlipY; }

        window.addEventListener('keydown', (e) => {
            if (state === 'DEATH_ANIMATION') return;
            
            if (e.code === 'Escape') {
                if (state === 'PLAY' || state === 'PAUSE') togglePause();
                else if (state === 'EDITOR_PLAY' || state === 'EDITOR_PLAY_PAUSED') stopPlaytest();
                else if (state === 'EDITOR') returnToMenu();
            }
            if (e.code === 'KeyF' && state === 'PAUSE') stepFrame();

            if (state === 'PLAY' || state === 'EDITOR_PLAY' || state === 'PAUSE') {
                if (e.code === 'Space' || e.code === 'ArrowUp') registerJumpInput();
            }

            if (state === 'EDITOR') {
                if (e.code === 'KeyR') {
                    if (activeMode === 'BUILD') rotateBuildObject();
                    else if (activeMode === 'EDIT' && selectedObjects.length > 0) rotateSelected();
                }
                if (e.code === 'KeyX') {
                    if (activeMode === 'BUILD') flipXBuildObject();
                    else if (activeMode === 'EDIT' && selectedObjects.length > 0) flipXSelected();
                }
                if (e.code === 'KeyY') {
                    if (activeMode === 'BUILD') flipYBuildObject();
                    else if (activeMode === 'EDIT' && selectedObjects.length > 0) flipYSelected();
                }

                if (activeMode === 'EDIT' && selectedObjects.length > 0) {
                    if (e.code === 'ArrowRight') moveSelected(gridSize, 0);
                    if (e.code === 'ArrowLeft') moveSelected(-gridSize, 0);
                    if (e.code === 'ArrowUp') moveSelected(0, -gridSize);
                    if (e.code === 'ArrowDown') moveSelected(0, gridSize);
                } else {
                    if (e.code === 'ArrowRight' || e.code === 'KeyD') editorScrollX += gridSize * 2;
                    if (e.code === 'ArrowLeft' || e.code === 'KeyA') editorScrollX = Math.max(0, editorScrollX - gridSize * 2);
                    if (e.code === 'ArrowUp' || e.code === 'KeyW') editorScrollY -= gridSize * 2;
                    if (e.code === 'ArrowDown' || e.code === 'KeyS') editorScrollY += gridSize * 2;
                }
            }
        });
        
        window.addEventListener('keyup', (e) => {
            if (e.code === 'Space' || e.code === 'ArrowUp') {
                isHoldingJump = false;
                orbClickAvailable = false; 
            }
        });

        canvas.addEventListener('contextmenu', e => e.preventDefault());
        canvas.addEventListener('mousemove', (e) => {
            let activeZoom = (state === 'EDITOR' || state === 'EDITOR_PLAY_PAUSED') ? editorZoomLevel : playZoomLevel;
            let rect = canvas.getBoundingClientRect();
            mouseX = (e.clientX - rect.left) / activeZoom;
            mouseY = (e.clientY - rect.top) / activeZoom;

            if (isBoxSelecting) {
                boxCurrent = { x: mouseX + editorScrollX, y: mouseY + editorScrollY };
            }
        });
        
        canvas.addEventListener('mousedown', (e) => {
            let activeZoom = (state === 'EDITOR' || state === 'EDITOR_PLAY_PAUSED') ? editorZoomLevel : playZoomLevel;

            if (state === 'PLAY' || state === 'EDITOR_PLAY') {
                registerJumpInput();
            }
            else if (state === 'EDITOR') {
                if (mouseY * activeZoom < 40) return; 
                
                let worldX = mouseX + editorScrollX;
                let worldY = mouseY + editorScrollY;

                if (activeMode === 'BUILD') {
                    handleBuildClick(e, worldX, worldY);
                } else if (activeMode === 'EDIT' || activeMode === 'DELETE') {
                    isBoxSelecting = true;
                    boxStart = { x: worldX, y: worldY };
                    boxCurrent = { x: worldX, y: worldY };
                }
            }
        });

        canvas.addEventListener('mouseup', (e) => {
            isHoldingJump = false;
            orbClickAvailable = false;

            if (state === 'EDITOR' && isBoxSelecting) {
                isBoxSelecting = false;
                let minX = Math.min(boxStart.x, boxCurrent.x);
                let maxX = Math.max(boxStart.x, boxCurrent.x);
                let minY = Math.min(boxStart.y, boxCurrent.y);
                let maxY = Math.max(boxStart.y, boxCurrent.y);

                let isDrag = (maxX - minX > 5 || maxY - minY > 5);

                if (activeMode === 'EDIT') {
                    if (!e.shiftKey && !isDrag) deselectAll();
                    levelData.forEach(obj => {
                        let objRight = obj.x + obj.w;
                        let objBottom = obj.y + obj.h;
                        if (isDrag) {
                            if (obj.x < maxX && objRight > minX && obj.y < maxY && objBottom > minY) {
                                if (!selectedObjects.includes(obj)) selectedObjects.push(obj);
                            }
                        } else {
                            if (boxStart.x >= obj.x && boxStart.x <= objRight && boxStart.y >= obj.y && boxStart.y <= objBottom) {
                                if (!selectedObjects.includes(obj)) selectedObjects.push(obj);
                            }
                        }
                    });
                } else if (activeMode === 'DELETE') {
                    levelData = levelData.filter(obj => {
                        let objRight = obj.x + obj.w;
                        let objBottom = obj.y + obj.h;
                        if (isDrag) {
                            return !(obj.x < maxX && objRight > minX && obj.y < maxY && objBottom > minY);
                        } else {
                            return !(boxStart.x >= obj.x && boxStart.x <= objRight && boxStart.y >= obj.y && boxStart.y <= objBottom);
                        }
                    });
                }
            }
        });

        function handleBuildClick(e, worldX, worldY) {
            let gridX = Math.floor(worldX / gridSize) * gridSize;
            let gridY = Math.floor(worldY / gridSize) * gridSize;

            if (e.button === 0) { // Place Object
                let existsSame = levelData.some(obj => obj.x === gridX && obj.y === gridY && obj.type === currentEditorObj);
                if (existsSame) return; 

                let h = gridSize;
                if (currentEditorObj === 'slope-1x2' || currentEditorObj.includes('portal') || currentEditorObj.startsWith('speed-')) h = 60;
                let newObj = {
                    type: currentEditorObj,
                    x: gridX, y: gridY, w: gridSize, h: h,
                    r: editorRotation, flipX: editorFlipX, flipY: editorFlipY
                };
                if (currentEditorObj.includes('orb') || currentEditorObj.includes('pad')) newObj.active = true;
                
                levelData.push(newObj);
            } 
            else if (e.button === 2) { // Delete Object
                let idx = -1;
                for(let i = levelData.length - 1; i >= 0; i--) {
                    if (levelData[i].x === gridX && levelData[i].y === gridY) {
                        idx = i; break;
                    }
                }
                if (idx !== -1) levelData.splice(idx, 1);
            }
        }

        function moveSelected(dx, dy) { selectedObjects.forEach(obj => { obj.x += dx; obj.y += dy; }); }
        function rotateSelected() { selectedObjects.forEach(obj => { obj.r = ((obj.r || 0) + 90) % 360; }); }
        function flipXSelected() { selectedObjects.forEach(obj => { obj.flipX = !obj.flipX; }); }
        function flipYSelected() { selectedObjects.forEach(obj => { obj.flipY = !obj.flipY; }); }

        function duplicateSelected() {
            let newSelection = [];
            selectedObjects.forEach(obj => {
                let copy = JSON.parse(JSON.stringify(obj));
                copy.x += gridSize; copy.y += gridSize;
                levelData.push(copy);
                newSelection.push(copy);
            });
            selectedObjects = newSelection;
        }

        function deselectAll() { selectedObjects = []; }
        function deleteSelected() {
            levelData = levelData.filter(obj => !selectedObjects.includes(obj));
            selectedObjects = [];
        }

        function selectObj(type) {
            currentEditorObj = type;
            document.querySelectorAll('#panel-build .editor-btn').forEach(b => b.classList.remove('active'));
            const activeBtn = document.getElementById('btn-' + type);

        // FIXED: Replaced window.confirm() with a direct reset to bypass sandbox blocking errors in some environments
        function clearLevel() { 
            try { if (window.confirm && !window.confirm("Clear level?")) return; } catch(e) {}
            levelData = []; deathMarks = []; clickIndicators = []; playerTrail = []; selectedObjects = [];

        /* ---- SAVE & LOAD LOGIC (TEXT AND ZIP) ---- */
        
        // Save ZIP containing JSON + MP3
        async function saveLevelZip() {
            if (levelData.length === 0) { alert("Level is currently empty!"); return; }
            
            const zip = new JSZip();
            
            let metadata = {
                bgColor: currentBgColor,
                groundColor: currentGroundColor,
                musicOffset: musicOffset,
                songFileName: currentSongFile ? currentSongFile.name : null,
                objects: levelData
            };

            // Add json data to zip
            zip.file("level.json", JSON.stringify(metadata, null, 2));

            // Add audio file if attached
            if (currentSongFile) {
                zip.file(currentSongFile.name, currentSongFile);
            }

            // Generate zip file and trigger download
            const content = await zip.generateAsync({ type: "blob" });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(content);
            a.download = "gd_level.zip";
            a.click();
            URL.revokeObjectURL(a.href);
        }

        // Load ZIP containing JSON + MP3
        async function handleZipUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            try {
                const zip = await JSZip.loadAsync(file);
                const jsonFile = zip.file("level.json");
                
                if (!jsonFile) {
                    alert("Invalid level file: level.json not found inside ZIP!");
                    return;
                }

                const jsonText = await jsonFile.async("string");
                const data = JSON.parse(jsonText);

                // Handle both new format and old direct-array fallback
                levelData = data.objects || data.levelData || (Array.isArray(data) ? data : []);
                
                if (data.bgColor) {
                    currentBgColor = data.bgColor;
                    document.getElementById('bgColor').value = currentBgColor;
                }
                if (data.groundColor) {
                    currentGroundColor = data.groundColor;
                    document.getElementById('groundColor').value = currentGroundColor;
                }
                if (typeof data.musicOffset === 'number') {
                    musicOffset = data.musicOffset;
                    document.getElementById('musicOffset').value = musicOffset;
                }

                // Reset interactive objects state
                levelData.forEach(obj => { 
                    if (obj.type.includes('orb') || obj.type.includes('pad')) obj.active = true; 
                });

                // Load audio from zip if present
                if (data.songFileName) {
                    const songFileInZip = zip.file(data.songFileName);
                    if (songFileInZip) {
                        const songBlob = await songFileInZip.async("blob");
                        currentSongFile = new File([songBlob], data.songFileName, { type: songBlob.type || 'audio/mpeg' });
                        
                        const url = URL.createObjectURL(currentSongFile);
                        bgAudio.src = url;
                        bgAudio.load();
                        isAudioLoaded = true;
                        
                        const fileNameSpan = document.getElementById('audio-filename');
                        if (fileNameSpan) {
                            fileNameSpan.innerText = currentSongFile.name;
                            fileNameSpan.title = currentSongFile.name;
                        }
                    }
                } else {
                    currentSongFile = null;
                    isAudioLoaded = false;
                    stopMusic();
                    bgAudio.src = "";
                    const fileNameSpan = document.getElementById('audio-filename');
                    if (fileNameSpan) fileNameSpan.innerText = "No Music";
                }

                deathMarks = []; clickIndicators = []; playerTrail = []; selectedObjects = [];
                alert("Level and song imported successfully!");
            } catch (err) {
                console.error(err);
                alert("Error reading ZIP file! Make sure it is a valid GD level .zip.");
            }

            event.target.value = ""; // Reset input
        }

        function resetPlayer() {
            player.gravityDir = 1;
            player.x = 150; player.y = groundY - player.height / 2;
            player.yVelocity = 0; player.slopeVelocity = 0;
            player.isGrounded = true; player.isOnSlope = false;
            player.rotation = 0; scrollX = 0; 
            
            gameScrollY = groundY - (canvas.height / playZoomLevel) + 40; 
            
            player.upwardFallTimer = 0;
            player.padCooldown = 0;
            currentGameSpeed = SPEEDS['1x'];
            isHoldingJump = false; orbClickAvailable = false;
            levelData.forEach(obj => { if (obj.type.includes('orb') || obj.type.includes('pad')) obj.active = true; });
        }

        function triggerDeath(currentTime) {
            if (state === 'DEATH_ANIMATION') return;
            
            let prevState = (state === 'PAUSE') ? pauseUI.dataset.prevState : state;
            state = 'DEATH_ANIMATION';
            deathStartTime = currentTime;
            
            stopMusic();

            deathMarks = [{ x: player.x + scrollX, y: player.y }]; 
            pauseUI.dataset.afterDeathState = prevState;
            
            particles = [];
            for(let i = 0; i < 40; i++) {
                particles.push({
                    x: player.x + scrollX, y: player.y,
                    vx: (Math.random() - 0.5) * 20, vy: (Math.random() - 0.5) * 20,
                    size: Math.random() * 8 + 4, color: Math.random() > 0.5 ? '#e94560' : '#ffffff'
                });
            }
        }
        
        function resolveDeath() {
            if (pauseUI.dataset.afterDeathState === 'EDITOR_PLAY' || pauseUI.dataset.afterDeathState === 'EDITOR_PLAY_PAUSED') {
                stopPlaytest();
                editorScrollX = Math.max(0, deathMarks[0].x - (canvas.width/editorZoomLevel/2));
                editorScrollY = deathMarks[0].y - (canvas.height/editorZoomLevel/2);
            } else {
                resetPlayer(); state = 'PLAY'; 
                playMusic();
            }
        }

        function stepFrame() { if (state === 'PAUSE') runPhysics(1.0, performance.now()); }

        function checkOverlap(rect1, rect2) {
            return (rect1.l < rect2.r && rect1.r > rect2.l && rect1.t < rect2.b && rect1.b > rect2.t);
        }

        function getSlopeVertices(obs) {
            let is1x2 = (obs.type === 'slope-1x2');
            let pivotX = obs.x + 15;
            let pivotY = is1x2 ? (obs.y + obs.h - 15) : (obs.y + 15);

            let localVerts = is1x2 ? [
                { x: -15, y: 15 },
                { x: 15, y: 15 },
                { x: 15, y: -45 }
            ] : [
                { x: -15, y: 15 },
                { x: 15, y: 15 },
                { x: 15, y: -15 }
            ];

            let rad = (obs.r || 0) * Math.PI / 180;
            let cos = Math.cos(rad);
            let sin = Math.sin(rad);

            return localVerts.map(v => {
                let fx = obs.flipX ? -v.x : v.x;
                let fy = obs.flipY ? -v.y : v.y;
                return {
                    x: pivotX + (fx * cos - fy * sin),
                    y: pivotY + (fx * sin + fy * cos)
                };
            });
        }

        function runPhysics(timeScale, currentTime) {
            let wasGroundedOnSlope = player.slopeVelocity !== 0;

            scrollX += (currentGameSpeed * timeScale);
            player.lastY = player.y;

            let orbHitThisFrame = false;
            let padHitThisFrame = false;

            if (player.padCooldown > 0) player.padCooldown -= timeScale;

            let pX = player.x + scrollX;
            
            let innerBounds = {
                l: pX - player.hitboxW / 2,
                r: pX + player.hitboxW / 2,
                t: player.y - player.hitboxH / 2,
                b: player.y + player.hitboxH / 2
            };

            let outerBounds = {
                l: pX - player.width / 2,
                r: pX + player.width / 2,
                t: player.y - player.height / 2,
                b: player.y + player.height / 2
            };

            if (orbClickAvailable) {
                for (let obs of levelData) {
                    if (obs.type.includes('orb') && obs.active) {
                        let o = { l: obs.x - 10, r: obs.x + 40, t: obs.y - 10, b: obs.y + 40 };
                        if (checkOverlap(innerBounds, o)) {
                            if (obs.type === 'orb') player.yVelocity = jumpStrength * player.gravityDir;
                            else if (obs.type === 'green-orb') { player.gravityDir *= -1; player.yVelocity = jumpStrength * player.gravityDir; }
                            else if (obs.type === 'blue-orb') { player.gravityDir *= -1; player.yVelocity = (player.gravityDir === -1) ? jumpStrength : -jumpStrength; }
                            player.isGrounded = false; player.isOnSlope = false;
                            obs.active = false; 
                            orbClickAvailable = false; 
                            orbHitThisFrame = true;
                            break; 
                        }
                    }
                }
            }

            if (!orbHitThisFrame && player.isGrounded && isHoldingJump) {
                player.yVelocity = jumpStrength * player.gravityDir;
                player.isGrounded = false; player.isOnSlope = false;
                player.slopeVelocity = 0; 
                orbClickAvailable = false; 
            }

            player.yVelocity += (gravity * player.gravityDir * timeScale);
            if (player.gravityDir === 1) {
                if (player.yVelocity > maxFallSpeed) player.yVelocity = maxFallSpeed;
            } else {
                if (player.yVelocity < -maxFallSpeed) player.yVelocity = -maxFallSpeed;
            }

            player.y += (player.yVelocity * timeScale);
            
            if (!player.isGrounded && !player.isOnSlope) player.rotation += (7 * timeScale); 

            innerBounds.t = player.y - player.hitboxH / 2;
            innerBounds.b = player.y + player.hitboxH / 2;
            
            outerBounds.t = player.y - player.height / 2;
            outerBounds.b = player.y + player.height / 2;

            let currentlyGrounded = false;
            let currentlyOnSlope = false;
            let currentSlopeVel = 0;

            if (player.y + player.height / 2 >= groundY) {
                if (player.gravityDir === 1) {
                    player.y = groundY - player.height / 2;
                    player.yVelocity = 0; currentlyGrounded = true;
                    player.rotation = Math.round(player.rotation / 90) * 90;
                } else {
                    triggerDeath(currentTime); return;
                }
            }

            let playerPX = player.x + scrollX;

            for (let obs of levelData) {
                let b = { l: obs.x, r: obs.x + obs.w, t: obs.y, b: obs.y + obs.h };

                if (obs.type === 'block') {
                    let overlapOuter = checkOverlap(outerBounds, b);
                    let overlapInner = checkOverlap(innerBounds, b);

                    if (overlapOuter) {
                        let isFallingDown = player.gravityDir === 1 && player.yVelocity >= 0 && player.lastY + player.height/2 <= b.t + 15;
                        let isFallingUp = player.gravityDir === -1 && player.yVelocity <= 0 && player.lastY - player.height/2 >= b.b - 15;

                        if (isFallingDown) {
                            player.y = obs.y - player.height / 2;
                            player.yVelocity = 0; currentlyGrounded = true; player.rotation = Math.round(player.rotation / 90) * 90;
                        } else if (isFallingUp) {
                            player.y = obs.y + obs.h + player.height / 2;
                            player.yVelocity = 0; currentlyGrounded = true; player.rotation = Math.round(player.rotation / 90) * 90;
                        } else if (overlapInner) {
                            triggerDeath(currentTime); return; 
                        }
                    }
                }

                // FIXED: Re-added the robust slope detection logic to allow jumping
                if (obs.type.startsWith('slope')) {
                    let verts = getSlopeVertices(obs);
                    let minX = Math.min(verts[0].x, verts[1].x, verts[2].x);
                    let maxX = Math.max(verts[0].x, verts[1].x, verts[2].x);

                    if (playerPX >= minX - 0.1 && playerPX <= maxX + 0.1) {
                        let edgeA = null, edgeB = null;
                        for (let i = 0; i < 3; i++) {
                            let p1 = verts[i];
                            let p2 = verts[(i + 1) % 3];
                            if (Math.abs(p1.x - p2.x) > 0.1 && Math.abs(p1.y - p2.y) > 0.1) {
                                edgeA = p1; edgeB = p2; break;
                            }
                        }

                        if (edgeA && edgeB) {
                            let t = (playerPX - edgeA.x) / (edgeB.x - edgeA.x);
                            let surfaceY = edgeA.y + t * (edgeB.y - edgeA.y);
                            let grad = (edgeB.y - edgeA.y) / (edgeB.x - edgeA.x);
                            let slopeVel = currentGameSpeed * grad;

                            if (player.gravityDir === 1) {
                                let pBottom = player.y + player.height / 2; 
                                let canSnap = player.isGrounded;
                                let isFalling = player.yVelocity >= slopeVel;

                                if ((canSnap && pBottom >= surfaceY - 6) || (isFalling && pBottom >= surfaceY - 2)) {
                                    if (player.lastY + player.height / 2 <= surfaceY + 25) {
                                        player.y = surfaceY - player.height / 2;
                                        currentlyGrounded = true; currentlyOnSlope = true;
                                        currentSlopeVel = slopeVel;
                                        player.yVelocity = currentSlopeVel;
                                        player.rotation = Math.atan(grad) * (180 / Math.PI);
                                    }
                                }
                            } else if (player.gravityDir === -1) {
                                let pTop = player.y - player.height / 2;
                                let canSnap = player.isGrounded;
                                let isFalling = player.yVelocity <= slopeVel;

                                if ((canSnap && pTop <= surfaceY + 6) || (isFalling && pTop <= surfaceY + 2)) {
                                    if (player.lastY - player.height / 2 >= surfaceY - 25) {
                                        player.y = surfaceY + player.height / 2;
                                        currentlyGrounded = true; currentlyOnSlope = true;
                                        currentSlopeVel = slopeVel;
                                        player.yVelocity = currentSlopeVel;
                                        player.rotation = -Math.atan(grad) * (180 / Math.PI);
                                    }
                                }
                            }
                        }
                    }
                }

                if (obs.type === 'spike') {
                    let s = { l: obs.x + 10, r: obs.x + 20, t: obs.y + 10, b: obs.y + 20 };
                    if (checkOverlap(innerBounds, s)) { triggerDeath(currentTime); return; }
                }

                if (obs.type === 'pad' || obs.type === 'blue-pad') {
                    let p = { l: obs.x, r: obs.x + 30, t: obs.y + 15, b: obs.y + 30 };
                    if (checkOverlap(outerBounds, p) && obs.active !== false && player.padCooldown <= 0) {
                        padHitThisFrame = true;
                        player.padCooldown = 5; 
                        if (obs.type === 'pad') {
                            player.yVelocity = padJumpStrength * player.gravityDir;
                        } else {
                            player.gravityDir *= -1;
                            player.yVelocity = (player.gravityDir === -1) ? padJumpStrength : -padJumpStrength;
                        }
                        player.y += (player.gravityDir === 1 ? -1 : 1); 
                        currentlyGrounded = false; currentlyOnSlope = false;
                        obs.active = false;
                    }
                }

                if (obs.type.includes('orb') && obs.active) {
                    let o = { l: obs.x - 10, r: obs.x + 40, t: obs.y - 10, b: obs.y + 40 };
                    if (checkOverlap(innerBounds, o) && orbClickAvailable) {
                        if (obs.type === 'orb') player.yVelocity = jumpStrength * player.gravityDir;
                        else if (obs.type === 'green-orb') { player.gravityDir *= -1; player.yVelocity = jumpStrength * player.gravityDir; }
                        else if (obs.type === 'blue-orb') { player.gravityDir *= -1; player.yVelocity = (player.gravityDir === -1) ? jumpStrength : -jumpStrength; }
                        player.isGrounded = false; currentlyGrounded = false; currentlyOnSlope = false;
                        obs.active = false; orbClickAvailable = false; 
                    }
                }

                if (obs.type === 'portal-blue' || obs.type === 'portal-yellow') {
                    let port = { l: obs.x + 10, r: obs.x + 20, t: obs.y, b: obs.y + obs.h };
                    if (checkOverlap(innerBounds, port)) player.gravityDir = (obs.type === 'portal-blue') ? 1 : -1;
                }

                if (obs.type.startsWith('speed-')) {
                    let sPort = { l: obs.x + 5, r: obs.x + obs.w - 5, t: obs.y, b: obs.y + obs.h };
                    if (checkOverlap(innerBounds, sPort)) {
                        let speedKey = obs.type.replace('speed-', '');
                        if (SPEEDS[speedKey]) currentGameSpeed = SPEEDS[speedKey];
                    }
                }
            }

            if (!currentlyGrounded && wasGroundedOnSlope && !isHoldingJump) player.yVelocity = player.slopeVelocity; 

            player.slopeVelocity = currentSlopeVel;
            player.isGrounded = currentlyGrounded;
            player.isOnSlope = currentlyOnSlope;
            
            let renderH = canvas.height / playZoomLevel;
            let groundViewY = groundY - renderH + 40; 
            let playerViewY = player.y - renderH * 0.55; 
            gameScrollY = Math.min(groundViewY, playerViewY);

            playerTrail.push({ x: player.x + scrollX, y: player.y });

            if (player.gravityDir === 1 || player.isGrounded || player.isOnSlope || orbHitThisFrame || padHitThisFrame) {
                player.upwardFallTimer = 0;
            } else {
                player.upwardFallTimer += (timeScale * (1000 / 60));
                if (player.upwardFallTimer >= 5000) {
                    triggerDeath(currentTime);
                    return;
                }
            }
        }

        function update(timeScale, currentTime) { 
            if (state === 'PLAY' || state === 'EDITOR_PLAY') {
                runPhysics(timeScale, currentTime); 
            } else if (state === 'DEATH_ANIMATION') {
                particles.forEach(p => {
                    p.x += p.vx * timeScale; p.y += p.vy * timeScale;
                    p.vy += (gravity * 0.4) * timeScale; 
                    p.vx *= 0.98; p.vy *= 0.98;
                });
                if (currentTime - deathStartTime >= DEATH_DURATION) resolveDeath();
            }
        }

        function drawObject(obs) {
            ctx.save();
            let is1x2 = (obs.type === 'slope-1x2');

            if (is1x2) {
                let baseX = obs.x + 15;
                let baseY = obs.y + obs.h - 15;
                ctx.translate(baseX, baseY);
                ctx.rotate((obs.r || 0) * Math.PI / 180);
                ctx.scale(obs.flipX ? -1 : 1, obs.flipY ? -1 : 1);
                var ox = -15; 
                var oy = -obs.h + 15;
            } else {
                ctx.translate(obs.x + obs.w / 2, obs.y + obs.h / 2);
                ctx.rotate((obs.r || 0) * Math.PI / 180);
                ctx.scale(obs.flipX ? -1 : 1, obs.flipY ? -1 : 1);
                var ox = -obs.w / 2; 
                var oy = -obs.h / 2;
            }

            if (obs.type === 'block') {
                ctx.fillStyle = currentGroundColor; ctx.fillRect(ox, oy, obs.w, obs.h);
                ctx.strokeStyle = groundLineColor; ctx.lineWidth = 2; ctx.strokeRect(ox, oy, obs.w, obs.h);
            }
            if (obs.type.startsWith('slope')) {
                ctx.fillStyle = currentGroundColor;
                ctx.beginPath(); ctx.moveTo(ox, oy + obs.h); ctx.lineTo(ox + obs.w, oy + obs.h); ctx.lineTo(ox + obs.w, oy); ctx.closePath(); ctx.fill();
                ctx.strokeStyle = groundLineColor; ctx.lineWidth = 2; ctx.stroke();
            }
            if (obs.type === 'spike') {
                ctx.fillStyle = '#ffb8b8'; 
                ctx.beginPath(); ctx.moveTo(0, oy); ctx.lineTo(ox + obs.w, oy + obs.h); ctx.lineTo(ox, oy + obs.h); ctx.fill();
            }
            if (obs.type.includes('pad')) {
                ctx.fillStyle = (obs.active === false) ? '#555' : (obs.type === 'pad') ? '#ffd700' : '#00ffff'; 
                ctx.fillRect(ox, oy + (obs.h - 10), obs.w, 10);
            }
            if (obs.type.includes('orb')) {
                if (!obs.active) ctx.fillStyle = '#555';
                else if (obs.type === 'orb') ctx.fillStyle = '#ffd700';
                else if (obs.type === 'green-orb') ctx.fillStyle = '#00ff00';
                else if (obs.type === 'blue-orb') ctx.fillStyle = '#00ffff';
                ctx.beginPath(); ctx.arc(0, 0, 12, 0, Math.PI * 2); ctx.fill();
                if (obs.active) { ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke(); }
            }
            if (obs.type.includes('portal') && !obs.type.startsWith('speed-')) {
                ctx.fillStyle = (obs.type === 'portal-blue') ? '#0088ff' : '#ffaa00';
                ctx.beginPath(); ctx.ellipse(0, 0, 10, 30, 0, 0, Math.PI * 2); ctx.fill();
                ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke();
            }
            if (obs.type.startsWith('speed-')) {
                let speedKey = obs.type.replace('speed-', '');
                let color = '#0088ff';
                if (speedKey === '0.5x') color = '#ffaa00';
                else if (speedKey === '1x') color = '#0088ff';
                else if (speedKey === '2x') color = '#00ff00';
                else if (speedKey === '3x') color = '#ff00ff';
                else if (speedKey === '4x') color = '#ff0044';

                ctx.fillStyle = color; ctx.fillRect(ox + 4, oy + 4, obs.w - 8, obs.h - 8);
                ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2; ctx.strokeRect(ox + 4, oy + 4, obs.w - 8, obs.h - 8);

                ctx.fillStyle = '#ffffff'; ctx.font = 'bold 11px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                ctx.fillText(speedKey, 0, 0);
            }

            if (selectedObjects.includes(obs)) {
                ctx.strokeStyle = '#ffff00'; ctx.lineWidth = 3; ctx.strokeRect(ox - 2, oy - 2, obs.w + 4, obs.h + 4);
            }

            if (showHitboxes) {
                ctx.strokeStyle = '#00ff00'; ctx.lineWidth = 1.5;
                if (obs.type === 'block') ctx.strokeRect(ox, oy, obs.w, obs.h);
                else if (obs.type.startsWith('slope')) {
                    ctx.beginPath(); ctx.moveTo(ox, oy + obs.h); ctx.lineTo(ox + obs.w, oy + obs.h); ctx.lineTo(ox + obs.w, oy); ctx.closePath(); ctx.stroke();
                } else if (obs.type === 'spike') ctx.strokeRect(-5, -5, 10, 10);
                else if (obs.type.includes('pad')) ctx.strokeRect(ox, oy + (obs.h - 15), 30, 15);
                else if (obs.type.includes('orb')) ctx.strokeRect(-25, -25, 50, 50);
                else if (obs.type.includes('portal') || obs.type.startsWith('speed-')) ctx.strokeRect(-10, -30, 20, 60);
            }

            ctx.restore();
        }

        function draw(currentTime) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            ctx.save();

            let activeZoom = (state === 'EDITOR' || state === 'EDITOR_PLAY_PAUSED') ? editorZoomLevel : playZoomLevel;
            ctx.scale(activeZoom, activeZoom);

            let activeScrollX = (state === 'EDITOR' || state === 'EDITOR_PLAY_PAUSED') ? editorScrollX : scrollX;
            let activeScrollY = (state === 'EDITOR' || state === 'EDITOR_PLAY_PAUSED') ? editorScrollY : gameScrollY;

            let renderW = canvas.width / activeZoom;
            let renderH = canvas.height / activeZoom;

            ctx.fillStyle = currentBgColor;
            ctx.fillRect(0, 0, renderW, renderH); 

            ctx.fillStyle = 'rgba(255, 255, 255, 0.05)';
            let bgParallaxX = activeScrollX * 0.3; 
            let bgTile = 100;
            let bgOffset = bgParallaxX % bgTile;
            
            for (let i = -bgOffset; i < renderW + bgTile; i += bgTile) ctx.fillRect(i, 0, 4, renderH); 
            for (let i = (-activeScrollY * 0.3) % bgTile - bgTile; i < renderH + bgTile; i += bgTile) ctx.fillRect(0, i, renderW, 4);  

            ctx.save();
            ctx.translate(-activeScrollX, -activeScrollY);

            ctx.fillStyle = currentGroundColor; 
            ctx.fillRect(activeScrollX, groundY, renderW, 2000); 
            
            ctx.fillStyle = 'rgba(0, 0, 0, 0.25)';
            let groundTile = 60;
            let groundOffset = activeScrollX % groundTile;
            for (let i = activeScrollX - groundOffset; i < activeScrollX + renderW + groundTile; i += groundTile) {
                ctx.fillRect(i, groundY, groundTile - 10, renderH - groundY);
            }

            ctx.fillStyle = groundLineColor; 
            ctx.fillRect(activeScrollX, groundY, renderW, 4);
            
            if (state === 'EDITOR') {
                ctx.strokeStyle = 'rgba(255,255,255,0.1)'; ctx.lineWidth = 1;
                
                let startX = Math.floor(activeScrollX / gridSize) * gridSize;
                for (let x = startX; x < startX + renderW + gridSize; x += gridSize) {
                    ctx.beginPath(); ctx.moveTo(x, activeScrollY); ctx.lineTo(x, activeScrollY + renderH); ctx.stroke();
                }
                let startY = Math.floor(activeScrollY / gridSize) * gridSize;
                for (let y = startY; y < startY + renderH + gridSize; y += gridSize) {
                    if (y <= groundY) { 
                        ctx.beginPath(); ctx.moveTo(activeScrollX, y); ctx.lineTo(activeScrollX + renderW, y); ctx.stroke();
                    }
                }

                let worldMouseX = mouseX + activeScrollX;
                let worldMouseY = mouseY + activeScrollY;
                let snapX = Math.floor(worldMouseX / gridSize) * gridSize;
                let snapY = Math.floor(worldMouseY / gridSize) * gridSize;

                if (activeMode === 'BUILD') {
                    ctx.globalAlpha = 0.5;
                    let h = gridSize;
                    if (currentEditorObj === 'slope-1x2' || currentEditorObj.includes('portal') || currentEditorObj.startsWith('speed-')) h = 60;
                    drawObject({
                        type: currentEditorObj, x: snapX, y: snapY, w: gridSize, h: h,
                        r: editorRotation, flipX: editorFlipX, flipY: editorFlipY
                    });
                    ctx.globalAlpha = 1.0;
                }

                if (isBoxSelecting) {
                    ctx.strokeStyle = activeMode === 'DELETE' ? '#e94560' : '#70e000';
                    ctx.fillStyle = activeMode === 'DELETE' ? 'rgba(233, 69, 96, 0.2)' : 'rgba(112, 224, 0, 0.2)';
                    ctx.lineWidth = 1.5;
                    let bw = boxCurrent.x - boxStart.x;
                    let bh = boxCurrent.y - boxStart.y;
                    ctx.fillRect(boxStart.x, boxStart.y, bw, bh);
                    ctx.strokeRect(boxStart.x, boxStart.y, bw, bh);
                }
            }

            for (let obs of levelData) {
                if (obs.x > activeScrollX - 100 && obs.x < activeScrollX + renderW + 100) {
                    drawObject(obs);
                }
            }

            if (playerTrail.length > 1 && (state === 'EDITOR' || state === 'EDITOR_PLAY' || state === 'EDITOR_PLAY_PAUSED')) {
                ctx.beginPath(); ctx.strokeStyle = 'rgba(0, 255, 0, 0.7)'; ctx.lineWidth = 2;
                ctx.moveTo(playerTrail[0].x, playerTrail[0].y);
                for (let i = 1; i < playerTrail.length; i++) ctx.lineTo(playerTrail[i].x, playerTrail[i].y);
                ctx.stroke();
            }

            if (state === 'EDITOR' || state === 'EDITOR_PLAY' || state === 'EDITOR_PLAY_PAUSED') {
                for (let ind of clickIndicators) {
                    ctx.save(); ctx.translate(ind.x, ind.y);
                    let size = 6; ctx.fillStyle = '#ff7700'; ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 1.5;
                    ctx.beginPath(); ctx.moveTo(0, -size); ctx.lineTo(size, 0); ctx.lineTo(0, size); ctx.lineTo(-size, 0); ctx.closePath();
                    ctx.fill(); ctx.stroke(); ctx.restore();
                }
                ctx.strokeStyle = '#ff0000'; ctx.lineWidth = 3;
                for (let mark of deathMarks) {
                    ctx.beginPath();
                    ctx.moveTo(mark.x - 10, mark.y - 10); ctx.lineTo(mark.x + 10, mark.y + 10);
                    ctx.moveTo(mark.x + 10, mark.y - 10); ctx.lineTo(mark.x - 10, mark.y + 10);
                    ctx.stroke();
                }
            }

            if (state === 'PLAY' || state === 'PAUSE' || state === 'EDITOR_PLAY' || state === 'EDITOR_PLAY_PAUSED') {
                ctx.save();
                ctx.translate(player.x + scrollX, player.y); 
                if (player.gravityDir === -1) ctx.scale(1, -1);
                ctx.rotate(player.rotation * Math.PI / 180);
                
                ctx.fillStyle = '#e94560'; ctx.fillRect(-player.width / 2, -player.height / 2, player.width, player.height);
                ctx.fillStyle = currentBgColor; ctx.fillRect(-player.width / 4, -player.height / 4, player.width / 2, player.height / 2);
                ctx.restore();

                if (showHitboxes) {
                    ctx.strokeStyle = '#00ff00'; ctx.lineWidth = 2;
                    ctx.strokeRect((player.x + scrollX) - player.width / 2, player.y - player.height / 2, player.width, player.height);
                    
                    ctx.strokeStyle = '#0088ff'; ctx.lineWidth = 2;
                    ctx.strokeRect((player.x + scrollX) - player.hitboxW / 2, player.y - player.hitboxH / 2, player.hitboxW, player.hitboxH);
                }
            }
            
            if (state === 'DEATH_ANIMATION') {
                let progress = (currentTime - deathStartTime) / DEATH_DURATION;
                let currentAlpha = Math.max(0, 1 - progress); 
                particles.forEach(p => {
                    ctx.globalAlpha = currentAlpha; ctx.fillStyle = p.color;
                    ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
                });
                ctx.globalAlpha = 1.0; 
            }

            ctx.restore();
            ctx.restore();
        }

        let lastTime = performance.now();
        function gameLoop(currentTime) {
            let deltaTime = currentTime - lastTime;
            lastTime = currentTime;
            let timeScale = deltaTime / (1000 / 60);
            if (timeScale > 3) timeScale = 3; 

            update(timeScale, currentTime);
            draw(currentTime); 
            requestAnimationFrame(gameLoop);
        }
        
        initEditorIcons();
        requestAnimationFrame(gameLoop);
    </script>
</body>
</html>
