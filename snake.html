<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snake — ArcadeHub</title>
<link rel="stylesheet" href="style.css">
<style>
  #snake-canvas {
    background: #f0fdf4;
    display: block;
    margin: 0 auto;
  }

  .center-canvas {
    display: flex;
    justify-content: center;
  }
</style>
</head>
<body>

<nav class="site-nav">
  <a class="nav-logo" href="index.html">Arcade<span>Hub</span></a>
  <ul class="nav-links">
    <li><a href="index.html">Home</a></li>
    <li><a href="snake.html" class="active">Snake</a></li>
    <li><a href="tetris.html">Tetris</a></li>
    <li><a href="breakout.html">Breakout</a></li>
  </ul>
</nav>

<main>
  <div class="game-page">
    <div class="game-page-header">
      <h1>🐍 Snake</h1>
      <p>Eat the red food to grow. Don't hit the walls or yourself.</p>
    </div>

    <div class="game-container">
      <div class="game-hud">
        <div class="hud-stat">
          <span class="label">Score</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="hud-stat">
          <span class="label">Best</span>
          <span class="value" id="best">0</span>
        </div>
        <div class="hud-stat">
          <span class="label">Speed</span>
          <span class="value" id="speed">1</span>
        </div>
        <div class="hud-spacer"></div>
        <button class="btn btn-ghost" id="pause-btn" onclick="togglePause()">Pause</button>
        <button class="btn btn-primary" onclick="startGame()">New Game</button>
      </div>

      <div class="center-canvas">
        <canvas id="snake-canvas" width="420" height="420"></canvas>
      </div>

      <div class="game-status" id="game-status"></div>

      <div class="controls-hint">
        <span class="key-hint">↑ ↓ ← →</span>
        <span class="key-hint">W A S D</span>
        <span class="key-hint">Space — Pause</span>
      </div>
    </div>
  </div>
</main>

<footer class="site-footer">
  <a href="index.html" style="color:inherit;text-decoration:none">← Back to all games</a>
  <span>ArcadeHub</span>
</footer>

<script>
const COLS = 21, ROWS = 21, CELL = 20;
const canvas = document.getElementById('snake-canvas');
const ctx = canvas.getContext('2d');

let snake, dir, nextDir, food, score, best = 0, gameLoop, paused, alive;

const COLORS = {
  head: '#16a34a',
  body: '#22c55e',
  bodyAlt: '#4ade80',
  food: '#dc2626',
  foodGlow: '#fca5a5',
  grid: '#e9fbe9',
  bg: '#f0fdf4',
  eye: '#ffffff',
};

function startGame() {
  clearInterval(gameLoop);
  snake = [{x:10,y:10},{x:9,y:10},{x:8,y:10},{x:7,y:10}];
  dir = {x:1,y:0};
  nextDir = {x:1,y:0};
  score = 0; paused = false; alive = true;
  document.getElementById('score').textContent = 0;
  document.getElementById('speed').textContent = 1;
  document.getElementById('pause-btn').textContent = 'Pause';
  setStatus('');
  placeFood();
  gameLoop = setInterval(step, 140);
  draw();
}

function placeFood() {
  let pos;
  do { pos = {x:Math.floor(Math.random()*COLS), y:Math.floor(Math.random()*ROWS)}; }
  while (snake.some(s => s.x===pos.x && s.y===pos.y));
  food = pos;
}

function step() {
  if (!alive || paused) return;
  dir = nextDir;
  const head = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};

  if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS || snake.some(s => s.x===head.x && s.y===head.y)) {
    alive = false;
    clearInterval(gameLoop);
    setStatus('lose', '💀 Game over! Score: ' + score);
    draw();
    return;
  }

  snake.unshift(head);

  if (head.x === food.x && head.y === food.y) {
    score += 10;
    if (score > best) { best = score; document.getElementById('best').textContent = best; }
    document.getElementById('score').textContent = score;
    const lvl = Math.floor(score / 50) + 1;
    document.getElementById('speed').textContent = lvl;
    clearInterval(gameLoop);
    gameLoop = setInterval(step, Math.max(60, 140 - (lvl-1)*12));
    placeFood();
  } else {
    snake.pop();
  }
  draw();
}

function draw() {
  ctx.fillStyle = COLORS.bg;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Grid lines
  ctx.strokeStyle = COLORS.grid;
  ctx.lineWidth = 0.5;
  for (let x = 0; x <= COLS; x++) { ctx.beginPath(); ctx.moveTo(x*CELL, 0); ctx.lineTo(x*CELL, ROWS*CELL); ctx.stroke(); }
  for (let y = 0; y <= ROWS; y++) { ctx.beginPath(); ctx.moveTo(0, y*CELL); ctx.lineTo(COLS*CELL, y*CELL); ctx.stroke(); }

  // Food
  const fx = food.x * CELL, fy = food.y * CELL;
  ctx.fillStyle = COLORS.food;
  const pad = 3;
  ctx.beginPath();
  ctx.roundRect(fx+pad, fy+pad, CELL-pad*2, CELL-pad*2, 5);
  ctx.fill();

  // Snake
  snake.forEach((seg, i) => {
    const x = seg.x * CELL, y = seg.y * CELL;
    const r = i === 0 ? 6 : 4;
    ctx.fillStyle = i === 0 ? COLORS.head : (i % 2 === 0 ? COLORS.body : COLORS.bodyAlt);
    ctx.beginPath();
    ctx.roundRect(x+1, y+1, CELL-2, CELL-2, r);
    ctx.fill();

    // Eyes on head
    if (i === 0) {
      const ex1 = dir.x === 0 ? x+5 : (dir.x > 0 ? x+13 : x+5);
      const ey1 = dir.y === 0 ? y+5 : (dir.y > 0 ? y+13 : y+5);
      const ex2 = dir.x === 0 ? x+15 : ex1;
      const ey2 = dir.y === 0 ? y+5 : ey1;
      ctx.fillStyle = COLORS.eye;
      ctx.beginPath(); ctx.arc(ex1, ey1, 2.5, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(ex2, ey2, 2.5, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#000';
      ctx.beginPath(); ctx.arc(ex1+dir.x, ey1+dir.y, 1.2, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(ex2+dir.x, ey2+dir.y, 1.2, 0, Math.PI*2); ctx.fill();
    }
  });

  // Pause overlay
  if (paused && alive) {
    ctx.fillStyle = 'rgba(240,253,244,0.85)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#16a34a';
    ctx.font = 'bold 1.5rem Outfit, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('PAUSED', canvas.width/2, canvas.height/2);
    ctx.textAlign = 'left';
  }

  // Start overlay
  if (!alive && score === 0 && !snake) {
    ctx.fillStyle = 'rgba(240,253,244,0.9)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#16a34a';
    ctx.font = 'bold 1.2rem Outfit, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('Press New Game to start', canvas.width/2, canvas.height/2);
    ctx.textAlign = 'left';
  }
}

function togglePause() {
  if (!alive) return;
  paused = !paused;
  document.getElementById('pause-btn').textContent = paused ? 'Resume' : 'Pause';
  draw();
}

function setStatus(type, msg) {
  const el = document.getElementById('game-status');
  el.className = 'game-status' + (type ? ' ' + type : '');
  el.textContent = msg || '';
}

document.addEventListener('keydown', e => {
  const map = {
    ArrowUp: {x:0,y:-1}, ArrowDown: {x:0,y:1}, ArrowLeft: {x:-1,y:0}, ArrowRight: {x:1,y:0},
    w: {x:0,y:-1}, s: {x:0,y:1}, a: {x:-1,y:0}, d: {x:1,y:0},
  };
  if (e.key === ' ') { e.preventDefault(); togglePause(); return; }
  const newDir = map[e.key];
  if (!newDir) return;
  e.preventDefault();
  if (newDir.x !== -dir.x || newDir.y !== -dir.y) nextDir = newDir;
});

// Touch swipe
let tx, ty;
canvas.addEventListener('touchstart', e => { tx = e.touches[0].clientX; ty = e.touches[0].clientY; }, {passive:true});
canvas.addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty;
  if (Math.abs(dx) > Math.abs(dy)) { const d = dx > 0 ? {x:1,y:0} : {x:-1,y:0}; if(d.x !== -dir.x) nextDir=d; }
  else { const d = dy > 0 ? {x:0,y:1} : {x:0,y:-1}; if(d.y !== -dir.y) nextDir=d; }
}, {passive:true});

// Draw idle state on load
ctx.fillStyle = COLORS.bg;
ctx.fillRect(0,0,canvas.width,canvas.height);
ctx.fillStyle = COLORS.grid;
ctx.lineWidth = 0.5;
for (let x=0;x<=COLS;x++){ctx.beginPath();ctx.moveTo(x*CELL,0);ctx.lineTo(x*CELL,ROWS*CELL);ctx.stroke();}
for (let y=0;y<=ROWS;y++){ctx.beginPath();ctx.moveTo(0,y*CELL);ctx.lineTo(COLS*CELL,y*CELL);ctx.stroke();}
ctx.fillStyle = '#15803d';
ctx.font = '600 1rem Outfit, sans-serif';
ctx.textAlign = 'center';
ctx.fillText('Press New Game to start', canvas.width/2, canvas.height/2);
ctx.textAlign = 'left';
</script>
</body>
</html>
